name: Release dry run
'on':
  pull_request:
    paths:
    - .github/workflows/release-dryrun.yml
permissions:
  contents: read
jobs:
  dryrun:
    name: Release dry run (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
        cache: true
    - name: Pre-build release binaries
      uses: goreleaser/goreleaser-action@v7
      with:
        version: v2.13.0
        args: build --clean --snapshot
    - name: Wait for CI to pass on the release commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        TAG: v2.23.16
        RELEASE_SHA: 6e18e1f279ab7dd0ec42d389194cdabd1b524cd9
      run: "set -euo pipefail\ndeadline=$((SECONDS + 25 * 60))\nsince=\"\" # set once CI is dispatched on the tag; older runs are ignored then\nwhile :; do\n  if (( SECONDS > deadline )); then\n    echo\
        \ \"::error::timed out waiting for CI on $RELEASE_SHA\" >&2\n    exit 1\n  fi\n  run=$(gh api \"repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&per_page=20\" --jq \"\n    [.workflow_runs[]\
        \ | select((.event == \\\"push\\\" or .event == \\\"workflow_dispatch\\\") and .created_at >= \\\"$since\\\")]\n    | first // empty | [.id, .status, .conclusion // \\\"\\\", .html_url] | map(tostring)\
        \ | join(\\\"|\\\")\") || { sleep 20; continue; }\n  IFS='|' read -r id status conclusion url <<< \"$run\"\n  if [[ -z \"$id\" || \"$conclusion\" =~ ^(cancelled|skipped|stale)$ ]]; then\n    if\
        \ [[ -z \"$since\" ]]; then\n      echo \"No usable CI run on main for $RELEASE_SHA (${conclusion:-none}); dispatching CI on $TAG\"\n      since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)\n \
        \     gh workflow run ci.yml --repo \"$REPO\" --ref \"$TAG\"\n    elif [[ -n \"$id\" ]]; then\n      echo \"::error::CI dispatched on $TAG ended $conclusion: $url\" >&2\n      exit 1\n    fi\n \
        \ elif [[ \"$status\" != \"completed\" ]]; then\n    echo \"CI for $RELEASE_SHA is $status: $url\"\n  elif [[ \"$conclusion\" == \"success\" ]]; then\n    echo \"CI passed for $RELEASE_SHA: $url\"\
        \n    exit 0\n  else\n    echo \"::error::CI for $RELEASE_SHA ended $conclusion: $url\" >&2\n    exit 1\n  fi\n  sleep 20\ndone\n"
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        version: v2.13.0
        args: release --clean --snapshot --skip=publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
