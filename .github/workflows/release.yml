name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: write # dispatch CI on the tag when main's run for this commit was cancelled
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points to a merged main commit
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '$TAG' must be vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::tag $TAG points to a commit that is not merged into main; merge the version-bump PR before tagging" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Verify BotVersion matches tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          if ! grep -qF "BotVersion:  \"${ver}\"" alita/config/config.go; then
            echo "::error::BotVersion in alita/config/config.go != ${ver} — prepare a version-bump PR with 'make bump-version TAG=${TAG}', merge it, then tag the merged commit" >&2
            exit 1
          fi
          if ! grep -qF "version = \"${TAG}\"" main.go; then
            echo "::error::CLI version fallback in main.go != ${TAG} — prepare a version-bump PR with 'make bump-version TAG=${TAG}', merge it, then tag the merged commit" >&2
            exit 1
          fi
          echo "BotVersion matches release tag ${TAG}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      # Cross-compiling every target is the slow part of a release. Do it while
      # main's CI for this commit may still be running, so the release step below
      # only relinks from the warm build cache.
      - name: Pre-build release binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: build --clean

      # The tag must sit on a main commit, and CI on main runs a superset of the
      # release checks (gosec, govulncheck, lint, build, migration chain, Postgres
      # integrity, full tests, coverage, docs and translations). Reuse that verdict
      # instead of re-running it. CI cancels superseded main runs, so a cancelled or
      # missing run is replaced by dispatching CI on the tag itself.
      - name: Wait for CI to pass on the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 25 * 60))
          since="" # set once CI is dispatched on the tag; older runs are ignored then
          while :; do
            if (( SECONDS > deadline )); then
              echo "::error::timed out waiting for CI on $RELEASE_SHA" >&2
              exit 1
            fi
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&per_page=20" --jq "
              [.workflow_runs[] | select((.event == \"push\" or .event == \"workflow_dispatch\") and .created_at >= \"$since\")]
              | first // empty | [.id, .status, .conclusion // \"\", .html_url] | map(tostring) | join(\"|\")") || { sleep 20; continue; }
            IFS='|' read -r id status conclusion url <<< "$run"
            if [[ -z "$id" || "$conclusion" =~ ^(cancelled|skipped|stale)$ ]]; then
              if [[ -z "$since" ]]; then
                echo "No usable CI run on main for $RELEASE_SHA (${conclusion:-none}); dispatching CI on $TAG"
                since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)
                gh workflow run ci.yml --repo "$REPO" --ref "$TAG"
              elif [[ -n "$id" ]]; then
                echo "::error::CI dispatched on $TAG ended $conclusion: $url" >&2
                exit 1
              fi
            elif [[ "$status" != "completed" ]]; then
              echo "CI for $RELEASE_SHA is $status: $url"
            elif [[ "$conclusion" == "success" ]]; then
              echo "CI passed for $RELEASE_SHA: $url"
              exit 0
            else
              echo "::error::CI for $RELEASE_SHA ended $conclusion: $url" >&2
              exit 1
            fi
            sleep 20
          done

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Clean up existing release (handle tag moves)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" &>/dev/null 2>&1; then
            echo "Existing release for $TAG found, deleting before recreate..."
            gh release delete "$TAG" --yes
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 7

  attest-artifacts:
    name: Attest Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [goreleaser]
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: ./artifacts

      - name: Attest artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "./artifacts/*"

  post-release-scan:
    name: Post-Release Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [goreleaser]
    if: always() && needs.goreleaser.result == 'success'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/divkix/alita_robot:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Release notification
        run: |
          echo "Release completed successfully!"
          echo "Artifacts published to GitHub Releases"
          echo "Docker images available at ghcr.io/divkix/alita_robot"
