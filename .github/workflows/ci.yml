name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Restore Go module and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Run Gosec Security Scanner
        run: |
          # gosec on the runner (not the docker action) so it reuses the cached
          # type information instead of re-analysing from a cold container cache
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          "$(go env GOPATH)/bin/gosec" -no-fail -fmt sarif -out gosec.sarif ./...

      - name: Upload Gosec SARIF
        continue-on-error: true # Gosec may produce SARIF with null artifactChanges which fails validation
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

  # Code quality - run on stable only (lint results don't vary by Go version)
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Restore Go module and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Own key family: the security and build jobs save under go-* in the
          # same run, and only the first save of a key wins, so nilaway's
          # module and analysis cache would rarely be kept.
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      # GoReleaser runs `go mod tidy` before building a release and refuses a
      # dirty tree, so an untidy go.mod must fail here, before it is tagged.
      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Run linting
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: binary
          args: --timeout 10m

      - name: Run nilaway
        run: make nilaway

      - name: Technical Debt Tracking
        run: |
          # Count TODO, FIXME, HACK, XXX comments in Go files. grep -c exits 1
          # on a zero count, which would fail the step under bash -e.
          TODO_COUNT=$(grep -r -n "TODO" --include="*.go" . 2>/dev/null | grep -c -v "godot\|godoc" || true)
          FIXME_COUNT=$(grep -r -n "FIXME" --include="*.go" . 2>/dev/null | wc -l)
          HACK_COUNT=$(grep -r -n "HACK" --include="*.go" . 2>/dev/null | wc -l)
          XXX_COUNT=$(grep -r -n "XXX" --include="*.go" . 2>/dev/null | wc -l)
          TOTAL=$((TODO_COUNT + FIXME_COUNT + HACK_COUNT + XXX_COUNT))

          {
            echo "## 📋 Technical Debt Report"
            echo ""
            echo "### Detected Technical Debt Markers"
            echo ""
            echo "| Marker | Count |"
            echo "|--------|-------|"
            echo "| TODO | $TODO_COUNT |"
            echo "| FIXME | $FIXME_COUNT |"
            echo "| HACK | $HACK_COUNT |"
            echo "| XXX | $XXX_COUNT |"
            echo ""
            echo "**Total Technical Debt Markers: $TOTAL**"
            echo ""

            # Show details if any markers found
            if [ "$TOTAL" -gt 0 ]; then
              echo "### Details"
              echo '```'
              grep -r -n -E "(TODO|FIXME|HACK|XXX)" --include="*.go" . 2>/dev/null | head -50
              echo '```'
            fi

            echo ""
            echo "**Note:** Please ensure TODO/FIXME comments reference an issue (e.g., TODO(#123))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run duplicate code and complexity detection
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: binary
          # dupl and gocyclo are left out of the main run (.golangci.yml) so
          # their existing backlog does not fail it; new code must pass them.
          args: --enable-only dupl,gocyclo --timeout 10m
          only-new-issues: true

      - name: Cyclomatic Complexity Analysis
        run: |
          # Install gocyclo for complexity analysis
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

          # Get high complexity functions
          HIGH_COMPLEX=$(gocyclo -over 15 . 2>/dev/null | grep -v "could not get file info" | sort -t= -k2 -nr || true)

          {
            echo "## 📊 Cyclomatic Complexity Report"
            echo ""

            # Run complexity analysis with threshold 15
            echo "### Functions with Complexity > 15"
            echo ""

            if [ -n "$HIGH_COMPLEX" ]; then
              echo "| Complexity | Function | Location |"
              echo "|------------|----------|----------|"
              echo "$HIGH_COMPLEX" | while read -r line; do
                # Parse the gocyclo output format: complexity package function file:line
                COMPLEX=$(echo "$line" | awk '{print $1}')
                PKG=$(echo "$line" | awk '{print $2}')
                FUNC=$(echo "$line" | awk '{print $3}')
                LOC=$(echo "$line" | awk '{print $4}')
                echo "| $COMPLEX | $PKG.$FUNC | $LOC |"
              done
              echo ""
              echo "⚠️ **Warning:** Functions with high cyclomatic complexity should be refactored for better maintainability."
            else
              echo "✅ No functions with cyclomatic complexity > 15 detected."
            fi

            echo ""
            echo "### Complexity Statistics"
            echo ""

            # Get top 10 most complex functions
            echo "**Top 10 Most Complex Functions:**"
            echo '```'
            gocyclo . 2>/dev/null | grep -v "could not get file info" | sort -t= -k2 -nr | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Build verification - run in parallel with other checks
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Restore Go module and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/alita_robot .
          # Version check from /tmp to avoid loading .env file (no services needed)
          cd /tmp && ./alita_robot --version

      - name: Upload build artifact
        if: matrix.go-version == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-${{ github.sha }}
          path: /tmp/alita_robot
          retention-days: 7

  # Automated regression tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alita_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: test-token
      OWNER_ID: "1"
      MESSAGE_DUMP: "1"
      REDIS_ADDRESS: "localhost:6379"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/alita_test?sslmode=disable"
      AUTO_MIGRATE: "false"
      USE_WEBHOOKS: "false"
      DEBUG: "false"
      CGO_ENABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Restore Go module and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Own key family: -race/-coverpkg objects are disjoint from the plain
          # build objects the other jobs use, and only one job per run_id can
          # save under a key (the first to finish wins) — sharing a family with
          # the plain-build jobs would leave this one permanently cold.
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-

      - name: Wait for PostgreSQL
        run: |
          for _ in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Wait for Redis
        run: |
          for _ in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Redis did not become ready in time"
          exit 1

      - name: Verify repository migration chain
        env:
          ALITA_TEST_MIGRATION_CHAIN: "true"
        run: go test -tags testtools -v -count=1 -run '^TestRepositoryMigrationChain$' ./alita/db/migrations

      - name: Run PostgreSQL integrity tests
        env:
          ALITA_TEST_DATABASE: "true"
        run: make test-postgres-integrity

      - name: Run test suite
        run: |
          # Run tests and capture timing (capture exit status to track duration even on failure)
          start_time=$(date +%s)
          make test || test_exit=$?
          end_time=$(date +%s)
          duration=$((end_time - start_time))

          # Print duration to logs
          echo "Test suite duration: ${duration}s"

          # Add to job summary
          {
            echo "## 🧪 Test Suite Performance"
            echo ""
            echo "**Total Duration:** ${duration} seconds"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Re-exit with test failure status if tests failed
          if [ -n "${test_exit}" ]; then
            exit "${test_exit}"
          fi

      - name: Check coverage threshold
        if: success()
        run: |
          if [ ! -f coverage.out ]; then
            echo "ERROR: coverage.out not found"
            exit 1
          fi

          THRESHOLD=78
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')

          {
            echo "## Coverage Report"
            echo ""
            echo "**Total Coverage:** ${COVERAGE}%"
            echo "**Minimum Threshold:** ${THRESHOLD}%"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Use awk for float comparison (bc may not be available)
          BELOW=$(awk "BEGIN {print ($COVERAGE < $THRESHOLD) ? 1 : 0}")
          if [ "$BELOW" -eq 1 ]; then
            echo "FAIL: Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "PASS: Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out
          retention-days: 30
          if-no-files-found: ignore

  # Docs & Translations drift gate
  docs-check:
    name: Docs & Translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Check translations
        run: make check-translations
      - name: Check generated docs drift
        run: make check-docs
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Check hand-written docs links
        working-directory: docs
        run: bun run check:links

  formal:
    name: Formal Models
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Model-check TLA+ specs
        run: make check-formal

  # Docker build verification (single arch, fast)
  docker-verify:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image (amd64 only)
        run: |
          docker build -f docker/alpine -t test-build:latest .
          docker images | grep test-build

  # Publish Docker images for main branch pushes
  docker-publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security, lint, build, test, docs-check, docker-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short commit SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=dev-${{ steps.short-sha.outputs.short_sha }}
            type=raw,value=${{ steps.short-sha.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Alita Robot Development Build
            org.opencontainers.image.description=Development build from main branch
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main,ignore-error=true
          provenance: true
          sbom: true

      - name: Add build info to job summary
        run: |
          {
            echo "## 🐳 Docker Build Complete"
            echo ""
            echo "**Main Branch Build**"
            echo "- **Latest Dev:** \`ghcr.io/${{ github.repository }}:dev\`"
            echo "- **Commit Build:** \`ghcr.io/${{ github.repository }}:${{ steps.short-sha.outputs.short_sha }}\`"
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "- **Platforms:** \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # CI success gate
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security, lint, build, test, docs-check, formal, docker-verify, docker-publish]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          # Check required jobs
          if [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.docs-check.result }}" != "success" ] || \
             [ "${{ needs.formal.result }}" != "success" ] || \
             [ "${{ needs.docker-verify.result }}" != "success" ]; then
            echo "One or more CI jobs failed!"
            exit 1
          fi

          # Check docker-publish only if it was supposed to run
          if [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ github.event_name }}" == "push" ]; then
            if [ "${{ needs.docker-publish.result }}" != "success" ]; then
              echo "Docker publish job failed!"
              exit 1
            fi
          fi

          echo "All CI checks passed!"
