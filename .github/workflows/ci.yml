name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Security scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Restore Go module and build cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-security-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: go-security-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          cache: false
          check-latest: false
          go-version-input: ${{ steps.go.outputs.go-version }}

      - name: Save Go module and build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Code quality - run on stable only (lint results don't vary by Go version)
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Restore Go module and build cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go', '.golangci.yml', 'Makefile') }}
          restore-keys: go-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-

      # GoReleaser runs `go mod tidy` before building a release and refuses a
      # dirty tree, so an untidy go.mod must fail here, before it is tagged.
      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Run linting
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: binary
          skip-save-cache: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          args: --timeout 10m

      - name: Run nilaway
        run: make nilaway

      - name: Technical Debt Tracking
        run: |
          # Count TODO, FIXME, HACK, XXX comments in Go files. grep -c exits 1
          # on a zero count, which would fail the step under bash -e.
          TODO_COUNT=$(grep -r -n "TODO" --include="*.go" . 2>/dev/null | grep -c -v "godot\|godoc" || true)
          FIXME_COUNT=$(grep -r -n "FIXME" --include="*.go" . 2>/dev/null | wc -l)
          HACK_COUNT=$(grep -r -n "HACK" --include="*.go" . 2>/dev/null | wc -l)
          XXX_COUNT=$(grep -r -n "XXX" --include="*.go" . 2>/dev/null | wc -l)
          TOTAL=$((TODO_COUNT + FIXME_COUNT + HACK_COUNT + XXX_COUNT))

          {
            echo "## 📋 Technical Debt Report"
            echo ""
            echo "### Detected Technical Debt Markers"
            echo ""
            echo "| Marker | Count |"
            echo "|--------|-------|"
            echo "| TODO | $TODO_COUNT |"
            echo "| FIXME | $FIXME_COUNT |"
            echo "| HACK | $HACK_COUNT |"
            echo "| XXX | $XXX_COUNT |"
            echo ""
            echo "**Total Technical Debt Markers: $TOTAL**"
            echo ""

            # Show details if any markers found
            if [ "$TOTAL" -gt 0 ]; then
              echo "### Details"
              echo '```'
              grep -r -n -E "(TODO|FIXME|HACK|XXX)" --include="*.go" . 2>/dev/null | head -50
              echo '```'
            fi

            echo ""
            echo "**Note:** Please ensure TODO/FIXME comments reference an issue (e.g., TODO(#123))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run duplicate code and complexity detection
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: binary
          skip-save-cache: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          # dupl and gocyclo are left out of the main run (.golangci.yml) so
          # their existing backlog does not fail it; new code must pass them.
          args: --enable-only dupl,gocyclo --timeout 10m
          only-new-issues: true

      - name: Cyclomatic Complexity Analysis
        run: |
          # Install gocyclo for complexity analysis
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest

          # Get high complexity functions
          HIGH_COMPLEX=$(gocyclo -over 15 . 2>/dev/null | grep -v "could not get file info" | sort -t= -k2 -nr || true)

          {
            echo "## 📊 Cyclomatic Complexity Report"
            echo ""

            # Run complexity analysis with threshold 15
            echo "### Functions with Complexity > 15"
            echo ""

            if [ -n "$HIGH_COMPLEX" ]; then
              echo "| Complexity | Function | Location |"
              echo "|------------|----------|----------|"
              echo "$HIGH_COMPLEX" | while read -r line; do
                # Parse the gocyclo output format: complexity package function file:line
                COMPLEX=$(echo "$line" | awk '{print $1}')
                PKG=$(echo "$line" | awk '{print $2}')
                FUNC=$(echo "$line" | awk '{print $3}')
                LOC=$(echo "$line" | awk '{print $4}')
                echo "| $COMPLEX | $PKG.$FUNC | $LOC |"
              done
              echo ""
              echo "⚠️ **Warning:** Functions with high cyclomatic complexity should be refactored for better maintainability."
            else
              echo "✅ No functions with cyclomatic complexity > 15 detected."
            fi

            echo ""
            echo "### Complexity Statistics"
            echo ""

            # Get top 10 most complex functions
            echo "**Top 10 Most Complex Functions:**"
            echo '```'
            gocyclo . 2>/dev/null | grep -v "could not get file info" | sort -t= -k2 -nr | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Go module and build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Build verification - run in parallel with other checks
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go ${{ matrix.go-version }}
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Restore Go module and build cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/alita_robot .
          # Version check from /tmp to avoid loading .env file (no services needed)
          cd /tmp && ./alita_robot --version

      - name: Upload build artifact
        if: matrix.go-version == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-${{ github.sha }}
          path: /tmp/alita_robot
          retention-days: 7

      - name: Save Go module and build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Integrity checks run alongside the race/coverage shards.
  postgres-integrity:
    name: PostgreSQL Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: test-token
      OWNER_ID: "1"
      MESSAGE_DUMP: "1"
      REDIS_ADDRESS: "localhost:6379"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/alita_test?sslmode=disable"
      AUTO_MIGRATE: "false"
      USE_WEBHOOKS: "false"
      DEBUG: "false"
      CGO_ENABLED: "1"
    steps:
      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=alita_test postgres:18 &
          postgres_pid=$!
          docker run -d --name redis -p 6379:6379 redis:8
          wait "$postgres_pid"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Restore Go module and build cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-integrity-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go', 'Makefile') }}
          restore-keys: go-integrity-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-

      - name: Wait for PostgreSQL
        run: |
          for _ in {1..30}; do
            docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d alita_test && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Wait for Redis
        run: |
          for _ in {1..30}; do
            [ "$(docker exec redis redis-cli ping)" = PONG ] && exit 0
            sleep 2
          done
          echo "Redis did not become ready in time"
          exit 1

      - name: Verify repository migration chain
        env:
          ALITA_TEST_MIGRATION_CHAIN: "true"
        run: go test -tags testtools -v -count=1 -run '^TestRepositoryMigrationChain$' ./alita/db/migrations

      - name: Run PostgreSQL integrity tests
        env:
          ALITA_TEST_DATABASE: "true"
        run: make test-postgres-integrity

      - name: Save Go module and build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  test-shards:
    name: Test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    outputs:
      shard-count: ${{ strategy.job-total }}
    env:
      BOT_TOKEN: test-token
      OWNER_ID: "1"
      MESSAGE_DUMP: "1"
      REDIS_ADDRESS: "localhost:6379"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/alita_test?sslmode=disable"
      AUTO_MIGRATE: "false"
      USE_WEBHOOKS: "false"
      DEBUG: "false"
      CGO_ENABLED: "1"
    steps:
      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=alita_test postgres:18 &
          postgres_pid=$!
          docker run -d --name redis -p 6379:6379 redis:8
          wait "$postgres_pid"
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Restore Go module and build cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go', 'Makefile', 'scripts/test_shard.sh') }}
          restore-keys: go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Wait for test services
        run: |
          for _ in {1..30}; do
            if docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d alita_test && [ "$(docker exec redis redis-cli ping)" = PONG ]; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Run test suite shard
        run: scripts/test_shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}"
      - name: Upload shard coverage and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: |
            coverage.out
            test-results.json
          retention-days: 7
          if-no-files-found: error
      - name: Save Go module and build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 0 && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-shards, postgres-integrity]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
      - name: Merge atomic coverage profiles
        run: |
          profiles=(coverage-shard-*/coverage.out)
          test "${#profiles[@]}" -eq "${{ needs.test-shards.outputs.shard-count }}"
          for profile in "${profiles[@]}"; do
            test -s "$profile"
            IFS= read -r mode < "$profile"
            test "$mode" = "mode: atomic"
          done
          {
            echo "mode: atomic"
            for profile in "${profiles[@]}"; do
              tail -n +2 "$profile"
            done
          } > coverage.out

      - name: Check coverage threshold
        if: success()
        run: |
          if [ ! -f coverage.out ]; then
            echo "ERROR: coverage.out not found"
            exit 1
          fi

          THRESHOLD=78
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')

          {
            echo "## Coverage Report"
            echo ""
            echo "**Total Coverage:** ${COVERAGE}%"
            echo "**Minimum Threshold:** ${THRESHOLD}%"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Use awk for float comparison (bc may not be available)
          BELOW=$(awk "BEGIN {print ($COVERAGE < $THRESHOLD) ? 1 : 0}")
          if [ "$BELOW" -eq 1 ]; then
            echo "FAIL: Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "PASS: Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.out
          retention-days: 30
          if-no-files-found: ignore

  # Docs & Translations drift gate
  docs-check:
    name: Docs & Translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Restore Go module and build cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-docs-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.mod', '**/go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: go-docs-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.mod', '**/go.sum') }}-
      - name: Check translations
        run: make check-translations
      - name: Check generated docs drift
        run: make check-docs
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Check hand-written docs links
        working-directory: docs
        run: bun run check:links
      - name: Save Go module and build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  formal:
    name: Formal Models
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Model-check TLA+ specs
        run: make check-formal

  # Docker build verification (single arch, fast)
  docker-verify:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image (amd64 only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/alpine
          platforms: linux/amd64
          load: true
          tags: test-build:latest
          cache-from: type=gha,scope=main
      - name: Verify Docker image
        run: docker image inspect test-build:latest

  # Publish Docker images for main branch pushes
  docker-publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security, lint, build, test, docs-check, docker-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short commit SHA
        id: short-sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=dev-${{ steps.short-sha.outputs.short_sha }}
            type=raw,value=${{ steps.short-sha.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Alita Robot Development Build
            org.opencontainers.image.description=Development build from main branch
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main,ignore-error=true
          provenance: true
          sbom: true

      - name: Add build info to job summary
        run: |
          {
            echo "## 🐳 Docker Build Complete"
            echo ""
            echo "**Main Branch Build**"
            echo "- **Latest Dev:** \`ghcr.io/${{ github.repository }}:dev\`"
            echo "- **Commit Build:** \`ghcr.io/${{ github.repository }}:${{ steps.short-sha.outputs.short_sha }}\`"
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "- **Platforms:** \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # CI success gate
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security, lint, build, test-shards, postgres-integrity, test, docs-check, formal, docker-verify, docker-publish]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          # Check required jobs
          if [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.test-shards.result }}" != "success" ] || \
             [ "${{ needs.postgres-integrity.result }}" != "success" ] || \
             [ "${{ needs.docs-check.result }}" != "success" ] || \
             [ "${{ needs.formal.result }}" != "success" ] || \
             [ "${{ needs.docker-verify.result }}" != "success" ]; then
            echo "One or more CI jobs failed!"
            exit 1
          fi

          # Check docker-publish only if it was supposed to run
          if [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ github.event_name }}" == "push" ]; then
            if [ "${{ needs.docker-publish.result }}" != "success" ]; then
              echo "Docker publish job failed!"
              exit 1
            fi
          fi

          echo "All CI checks passed!"
