name: Dependabot Native Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    steps:
      - name: Get dependency metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve and enable auto-merge for minor/patch updates
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.metadata.outputs.dependency-names, 'github.com/PaulSonOfLars/gotgbot/v2') &&
          !contains(steps.metadata.outputs.dependency-names, 'github.com/PaulSonOfLars/gotg_md2html')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPOSITORY: ${{ github.repository }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "Auto-approving $UPDATE_TYPE update"
          gh pr review "$PR_NUMBER" --approve --repo "$REPOSITORY"
          gh pr merge "$PR_NUMBER" --auto --squash --repo "$REPOSITORY"

      - name: Comment on updates requiring manual review
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-major' ||
          contains(steps.metadata.outputs.dependency-names, 'github.com/PaulSonOfLars/gotgbot/v2') ||
          contains(steps.metadata.outputs.dependency-names, 'github.com/PaulSonOfLars/gotg_md2html')
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          comment_body="🔄 **Manual dependency review required**

          **Update type:** \`$UPDATE_TYPE\`
          **Dependency:** \`$DEPENDENCY_NAMES\`

          Major updates and compatibility-sensitive gotgbot/gotg_md2html updates are not auto-merged.

          @$REPOSITORY_OWNER please review this update carefully."

          gh pr comment "$PR_NUMBER" --body "$comment_body" --repo "$REPOSITORY"
