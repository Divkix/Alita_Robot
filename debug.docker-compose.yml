# This is to run the alita-robot in debug mode with alpine image
# This starts up fast and does not do any optimizations
services:
  alita:
    build:
      context: .
      dockerfile: docker/alpine.debug
    container_name: alita-robot
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-alita_robot}?sslmode=disable
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redisPassword}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    # Existing postgres_debug_data volumes from pg15/pg17 must be removed (docker compose -f debug.docker-compose.yml down -v) before pg18 starts
    image: postgres:18-alpine
    container_name: alita-postgres-debug
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-alita_robot}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_debug_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:latest
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redisPassword}
    ports:
      - "6379:6379"

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    # no ports published; internal use

volumes:
  postgres_debug_data:
  telegram-bot-api-data:
