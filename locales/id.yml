logchannels_examples_docs: |
  <b>Menyiapkan kanal log:</b>
  1. Tambahkan bot ke kanal sebagai admin yang bisa mengirim pesan.
  2. Kirim <code>/setlog</code> di kanal.
  3. Dalam satu jam, teruskan pesan /setlog itu ke grup Anda.

  <b>Menyiapkan dan mengelolanya dari chat pribadi:</b>
  Di chat pribadi, sebutkan grup lebih dulu: ID-nya, @username-nya, atau judul grup tempat Anda menjadi admin (huruf besar dan kecil tidak dibedakan; beri tanda kutip pada judul yang mengandung spasi). Tidak ada yang diposting di grup, dan kanal hanya menerima catatan pengaturan seperti biasa.
  • <code>/setlog @mygroup @mychannel</code> - tautkan kanal dengan @username-nya
  • <code>/setlog -1001234567890 -1009876543210</code> - tautkan dengan ID
  • <code>/log @mygroup admin</code> - aktifkan satu kategori
  • <code>/nolog -1001234567890 settings</code> - nonaktifkan satu kategori
  • <code>/logchannel @mygroup</code> - tampilkan kanal log
  • <code>/unsetlog @mygroup</code> - hapus kanal log
  Anda harus menjadi admin grup, dan juga pemilik kanal atau admin kanal dengan izin mengirim pesan, sama seperti yang diperlukan untuk mengirim /setlog di sana; bot harus menjadi admin kanal yang bisa mengirim pesan. Jika Anda terhubung dengan /connect, grup boleh tidak disebutkan: <code>/setlog @mychannel</code>. Selama Anda terhubung, /setlog, /log dan /nolog tidak mencari berdasarkan judul: sebutkan grup lain dengan @username atau ID-nya. Grup melewati pemeriksaan yang sama seperti /connect, dan koneksi Anda tidak berubah.

  <b>Memilih apa yang dicatat:</b>
  • <code>/logcategories</code> - daftar kategori
  • <code>/log admin user</code> - aktifkan dua kategori
  • <code>/nolog settings</code> - nonaktifkan satu kategori

federations_permissions_docs: |
  <b>Pemilik federasi:</b>
  • <code>/delfed</code> (di PM), <code>/renamefed</code>, <code>/fedpromote</code>, <code>/feddemote</code>, <code>/fedreason</code>, <code>/fednotif</code>, <code>/subfed</code>, <code>/unsubfed</code>, <code>/fedsubs</code>, <code>/setfedlog</code>, <code>/unsetfedlog</code>, <code>/fbanlist</code>, <code>/importfbans</code>

  <b>Admin federasi:</b>
  • <code>/fban</code>, <code>/unfban</code>, <code>/funban</code> di grup anggota (di PM berlaku untuk federasi milik Anda), <code>/feddemoteme</code>

  <b>Pembuat grup:</b>
  • <code>/joinfed</code>, <code>/leavefed</code>

  <b>Admin grup:</b>
  • <code>/quietfed</code>

  <b>Siapa saja:</b>
  • <code>/newfed</code> (di PM, satu federasi per pengguna), <code>/fedstat</code>, <code>/fbanstat</code>, <code>/fedinfo</code>, <code>/fedadmins</code>, <code>/chatfed</code>, <code>/myfeds</code>

  <b>Persyaratan Bot:</b>
  • Blokir pengguna di setiap chat anggota, untuk menegakkan fban

logchannels_permissions_docs: |
  <b>Izin Pengguna:</b>
  • <code>/setlog</code> dikirim di kanal itu sendiri, tempat hanya admin kanal yang bisa mengirim pesan.
  • Hanya admin grup yang bisa menautkan kanal dengan meneruskan pesan itu, dan hanya mereka yang bisa menggunakan <code>/unsetlog</code>, <code>/log</code> dan <code>/nolog</code>.
  • <code>/setlog</code> di chat pribadi hanya menautkan kanal untuk admin grup yang merupakan pemilik kanal atau admin kanal dengan izin mengirim pesan.
  • Siapa saja bisa menggunakan <code>/logchannel</code> dan <code>/logcategories</code>; di chat pribadi, <code>/logchannel</code> berfungsi untuk grup yang bisa Anda hubungkan dengan <code>/connect</code>.

  <b>Izin Bot:</b>
  • Bot harus menjadi admin kanal log dengan izin mengirim pesan, baik untuk melihat <code>/setlog</code> maupun untuk mengirim catatan log. Catatan yang tidak bisa dikirim akan dibuang tanpa pesan kesalahan.
