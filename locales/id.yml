# AntiRaid module strings
antiraid_help_msg: |
  Lindungi grup Anda dari serangan spam-join dengan AntiRaid.
  *Perintah Admin:*
  /antiraid: Tampilkan status saat ini + tombol aktifkan/nonaktifkan.
  /antiraid on: Aktifkan mode raid untuk waktu yang dikonfigurasi.
  /antiraid <duration>: Aktifkan untuk durasi kustom (mis. 3h, 30m).
  /antiraid off: Nonaktifkan mode raid segera.
  /raidtime <time>: Atur durasi raid (default: 6h).
  /raidactiontime <time>: Atur durasi temp-ban (default: 1h).
  /autoantiraid <N>: Aktifkan otomatis jika N+ bergabung/menit.
  /autoantiraid off: Nonaktifkan pemicu otomatis.
