aispam_invalid_option: "Saya hanya memahami salah satu opsi: <code>on</code>/<code>off</code>/<code>yes</code>/<code>no</code>/<code>true</code>/<code>false</code>/<code>enable</code>/<code>disable</code>"
aispam_breaker_notice: "⚠️ Pemeriksaan spam AI dijeda di chat ini selama beberapa menit setelah penyedia AI gagal berulang kali. Pemeriksaan lanjut sendiri, dan filter tetap aktif."

# Spam database join check strings
spamdb_help_msg: |
  <b>🛡 Database Spam</b>

  Pemeriksaan opsional yang mencari setiap anggota baru di database spam saat mereka bergabung, lalu menindak yang terdaftar. CAS (cas.chat) diperiksa secara bawaan; lols.bot dan jaringan Shared bans milik bot ini bisa ditambahkan.

  Admin, pengguna yang disetujui, dan bot tidak pernah diperiksa. Jika sebuah database tidak bisa dihubungi, anggota tetap masuk. Setiap tindakan hanya dilaporkan ke kanal log, tidak pernah di grup.


  *Perintah admin:*

  × /spamdb: Tampilkan apakah pemeriksaan aktif, database mana yang ditanyai, dan apa yang dilakukannya.

  × /spamdb `<on/off>`: Aktifkan atau nonaktifkan pemeriksaan di chat ini.

  × /spamdb db `<cas/lols/shared>` `<on/off>`: Pilih database. CAS aktif secara bawaan, dan minimal satu harus tetap aktif. lols.bot mendaftarkan akun lebih agresif, jadi lebih banyak positif palsu. Shared bans nonaktif secara bawaan, membutuhkan jaringan reputasi bersama dari operator, dan mendaftarkan pengguna yang baru-baru ini dikeluarkan oleh beberapa chat.

  × /spamdb action `<ban/mute/log>`: Pilih tindakan untuk anggota yang terdaftar. Bawaannya ban; log hanya melaporkannya.


  Pemeriksaan nonaktif di semua chat sampai admin mengaktifkannya. Jika aktif, ID Telegram setiap anggota baru dikirim ke setiap database eksternal yang dipilih (cas.chat, lols.bot). Shared bans tetap di dalam bot dan tidak mengirim apa pun.
