# Rose feature-parity keys (federations, log channels, extras)
federations_help_msg: |
  Federasi berbagi daftar ban di antara grup-grup yang Anda miliki.

  *Pemilik (PM):*
  × /newfed <name>: Buat federasi (satu per pengguna).
  × /renamefed <name>: Ganti nama federasi Anda.
  × /delfed: Hapus federasi Anda (dengan konfirmasi).
  × /fedpromote /feddemote <user>: Promosikan atau turunkan admin federasi (balasan, ID, atau @username).
  × /fedreason on/off: Wajibkan alasan untuk fban.
  × /fednotif on/off: Beri tahu pemilik soal fban lewat PM.
  × /subfed /unsubfed <fed_id>: Berlangganan atau berhenti berlangganan ban federasi lain (maks. 5).
  × /fedsubs: Tampilkan federasi yang dilanggan federasi Anda.
  × /fbanlist [csv|json|minicsv]: Ekspor fban.
  × /importfbans: Impor dari file CSV/JSON yang dibalas.
  × /unsetfedlog: Hapus obrolan log federasi.

  *Pemilik (di grup):*
  × /setfedlog: Jadikan grup ini obrolan log federasi Anda.

  *Pemilik grup:*
  × /joinfed <fed_id>: Gabungkan obrolan ini ke federasi.
  × /leavefed: Keluar dari federasi.

  *Admin grup:*
  × /quietfed on/off: Sembunyikan notifikasi fban pasif.

  *Admin federasi:*
  × /fban <user> [reason]: Ban pengguna di seluruh federasi (di grup federasi; pemilik juga bisa memakainya di PM).
  × /unfban /funban <user>: Cabut ban federasi.
  × /feddemoteme <fed_id>: Mundur sebagai admin federasi.

  *Siapa saja:*
  × /fedstat /fbanstat [user] [fed_id]: Cek fban seorang pengguna (milik Anda secara bawaan); dengan fed_id, tampilkan alasan ban tersebut.
  × /fedinfo [fed_id]: Tampilkan info federasi.
  × /fedadmins [fed_id]: Tampilkan daftar admin sebuah federasi.
  × /chatfed: Tampilkan federasi grup ini (hanya di grup).
  × /myfeds: Tampilkan federasi yang Anda miliki atau kelola sebagai admin.
logchannels_help_msg: |
  Kirim tindakan admin ke kanal log khusus.

  1. Tambahkan bot ke kanal sebagai admin.
  2. Di kanal itu, kirim /setlog.
  3. Teruskan pesan itu ke grup.

  *Perintah admin:*
  × /setlog: Atur kanal log (kirim di kanal, lalu teruskan pesannya ke grup). Di chat pribadi, sebutkan grup lalu kanalnya, jika kamu admin di keduanya dan bot bisa memposting di kanal.
  × /unsetlog: Hapus kanal log.
  × /log <category>: Aktifkan kategori.
  × /nolog <category>: Nonaktifkan kategori.

  *Siapa saja:*
  × /logchannel: Tampilkan kanal log saat ini.
  × /logcategories: Daftar kategori.

  Kategori: settings (perubahan kanal log dan mode AntiRaid), admin (ban, kick, bisukan, unban, dan batal bisukan), user (/kickme dan /banme), reports (laporan pengguna), automated (tindakan yang diambil bot sendiri: temuan di basis data spam, tindakan antiflood dan daftar hitam, batas peringatan yang tercapai lewat peringatan daftar hitam, captcha gagal, mode AntiRaid yang menyala karena ambang bergabung, bot yang diban oleh kunci bots), warns (peringatan yang diberikan, dihapus, dan diatur ulang oleh admin, serta batas peringatan yang tercapai lewat peringatan mereka; mati sampai dinyalakan dengan /log warns), joins (anggota yang lolos captcha; mati sampai dinyalakan dengan /log joins), other. Belum ada yang dicatat di other.

  Di chat pribadi, sebutkan grup lebih dulu pada /setlog, /unsetlog, /log, /nolog dan /logchannel: judulnya, @username, atau ID-nya.
