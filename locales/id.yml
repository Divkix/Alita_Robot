# Weekly digest strings
digest_help_msg: |
  <b>📊 Ringkasan mingguan</b>

  Bot menghitung pesan, bergabung, dan keluar di chat ini setiap hari dalam UTC dan menyimpan totalnya selama satu tahun. Admin dapat mengaktifkan ringkasan mingguan yang mengirim total minggu sebelumnya, dengan perubahan dari minggu sebelumnya, setiap Senin setelah 00:00 UTC. Ringkasan dikirim ke kanal log jika chat ini memilikinya, jika tidak ke grup.

  *Perintah admin:*

  × /digest: Tampilkan apakah ringkasan aktif dan ke mana dikirim.
  × /digest on: Aktifkan ringkasan mingguan.
  × /digest off: Nonaktifkan ringkasan mingguan.
  × /digest here: Kirim ringkasan ke grup ini.
  × /digest log: Kirim ringkasan ke kanal log (perlu kanal log).
  × /digest now: Pratinjau minggu ini dengan tampilan yang sama seperti ringkasan.

  Hitungan disimpan per chat dan tidak pernah menyertakan teks pesan.
