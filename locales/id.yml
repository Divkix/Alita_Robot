connections_help_msg:
  "Modul ini memungkinkan Anda untuk terhubung ke database obrolan, dan
  menambahkan sesuatu ke sana tanpa obrolan mengetahuinya! Untuk alasan yang jelas, Anda perlu
  menjadi admin untuk menambahkan sesuatu; tetapi anggota mana pun dapat melihat data Anda. (pengguna yang dilarang/ditendang tidak bisa!)


  *Perintah*:

  × /connect `<chatid>`: Terhubung ke obrolan yang ditentukan, memungkinkan Anda untuk melihat/mengedit
  konten.

  × /disconnect: Memutuskan dari obrolan saat ini.

  × /reconnect: Menghubungkan kembali ke obrolan yang terhubung sebelumnya

  × /connection: Melihat informasi tentang obrolan yang saat ini terhubung.

  × /settings: Pilih grup tempat Anda menjadi admin dan lihat semua pengaturannya; nilai yang berbeda dari bawaan ditandai dengan •. Hanya grup tempat Anda menulis sejak saya bergabung yang ditampilkan; untuk yang lain gunakan /connect `<chatid>` atau kirim /settings di grup.


  *Perintah Admin:*

  × /allowconnect <yes/no>: Izinkan pengguna untuk terhubung ke obrolan atau tidak.

  Saat terhubung, admin juga dapat menjalankan /captcha, /antiraid, /aispam, /anonadmin, /addreaction, /allowconnect dan /lang group dari obrolan pribadi.

  Di obrolan pribadi, /rules, /notes, /filters, dan banyak perintah pengaturan, seperti /lock, /setflood, /setwelcome, dan /setwarnlimit, menerima grup sebagai argumen pertama: ID-nya, @username-nya, atau judul grup tempat Anda menjadi admin. Judul hanya dicari di antara grup yang terhubung dan 50 grup yang paling baru aktif tempat Anda pernah menulis; sebut grup lain dengan @username atau ID-nya.

  Dari obrolan pribadi, pemilik grup juga dapat menjalankan /clearall, /stopall, /remallbl, /unapproveall, /resetallwarns dan /unbanall, dan adminnya /privnote: sebutkan grupnya dulu (judul, @username, atau ID-nya) atau hubungkan ke grup itu. Konfirmasi berlaku untuk grup itu dan hanya pemiliknya yang dapat menekannya.

  Dari obrolan pribadi, admin grup juga dapat menjalankan /adminlist, /invitelink, /setgtitle, /setgdesc, /admincache dan /clearadmincache: sebutkan grupnya dulu (judul, @username, atau ID-nya) atau hubungkan ke grup itu. Hak yang diperlukan sama seperti di grup, dan jawabannya dikirim ke obrolan pribadi.

  Dari obrolan pribadi, admin grup juga dapat menjalankan /ban, /sban, /tban, /unban, /kick, /skick, /restrict, /unrestrict, /mute, /smute, /tmute, /unmute, /warn, /swarn, /rmwarn dan /resetwarns: sebutkan grupnya dulu (judul, @username, atau ID-nya), lalu penggunanya (@username, ID, atau mention), atau hubungkan ke grup itu. Saat terhubung, grup lain hanya dapat dipilih dengan @username atau ID. Hak yang diperlukan sama seperti di grup; membalas pesan di obrolan pribadi tidak menunjuk pengguna, dan jawaban serta tombolnya dikirim ke obrolan pribadi.

  Dari obrolan pribadi, anggota grup juga dapat melihat peringatan seorang pengguna di grup itu dengan /warns jika grup mengizinkan anggota terhubung (/allowconnect; jika tidak, hanya adminnya), dan adminnya melihat pengaturan peringatan grup dengan /warnings: sebutkan grupnya dulu (@username atau ID-nya; adminnya juga dapat memakai judulnya), lalu untuk /warns penggunanya, atau hubungkan ke grup itu. Jawabannya dikirim ke obrolan pribadi.


  Anda dapat mengambil id obrolan dengan menggunakan perintah /id di obrolan Anda. Jangan terkejut
  jika id negatif; semua grup super memiliki id negatif."
