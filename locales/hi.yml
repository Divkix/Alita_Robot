# AntiRaid module strings
antiraid_help_msg: |
  AntiRaid के साथ अपने समूह को स्पैम-ज्वाइन हमलों से बचाएं।
  *एडमिन कमांड:*
  /antiraid: वर्तमान स्थिति दिखाएं + सक्षम/अक्षम बटन।
  /antiraid on: कॉन्फ़िगर किए गए समय के लिए रेड मोड सक्षम करें।
  /antiraid <duration>: कस्टम अवधि के लिए सक्षम करें (उदा. 3h, 30m)।
  /antiraid off: रेड मोड तुरंत अक्षम करें।
  /raidtime <time>: रेड अवधि सेट करें (डिफ़ॉल्ट: 6h)।
  /raidactiontime <time>: टेम्प-बैन अवधि सेट करें (डिफ़ॉल्ट: 1h)।
  /autoantiraid <N>: यदि N+ जॉइन्स/मिन तो ऑटो-सक्षम करें।
  /autoantiraid off: ऑटो-ट्रिगर अक्षम करें।
