# Backup/Restore module strings
backup_help_msg: |
  <b>📦 बैकअप और रिस्टोर</b>

  अपने ग्रुप सेटिंग्स को JSON फाइलों का उपयोग करके बैकअप और रिस्टोर करें।

  <b>उपयोगकर्ता कमांड:</b>
  • /export - सभी ग्रुप सेटिंग्स को JSON फाइल में एक्सपोर्ट करें
  • /export notes filters rules - केवल विशिष्ट मॉड्यूल एक्सपोर्ट करें

  <b>क्रिएटर कमांड:</b>
  • /import - सेटिंग्स रिस्टोर करने के लिए बैकअप फाइल का जवाब दें
  • /import notes filters - केवल विशिष्ट मॉड्यूल आयात करें
  • /reset - सभी सेटिंग्स डिफ़ॉल्ट पर रीसेट करें
  • /reset warns locks - केवल विशिष्ट मॉड्यूल रीसेट करें

  <b>रेट लिमिट:</b>
  • एक्सपोर्ट: 5 मिनट में 1 बार
  • इम्पोर्ट: 10 मिनट में 1 बार
  • रीसेट: 1 घंटे में 1 बार

