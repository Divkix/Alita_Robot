# Help module keys
help_about: "@%s सबसे तेज़ और सबसे फीचर-समृद्ध ग्रुप मैनेजरों में से एक है।


  Alita ✨ को @DivideProjects द्वारा विकसित और सक्रिय रूप से बनाए रखा गया है!


  Alita 2020 से ऑनलाइन है और इसने सैकड़ों-हजारों उपयोगकर्ताओं के साथ हजारों समूहों की सेवा की है!


  <b>Alita क्यों:</b>

  - सरल: आसान उपयोग और कई बॉट कमांड के साथ संगत।

  - फीचर-समृद्ध: कई विशेषताएं जो अन्य ग्रुप प्रबंधन बॉट्स में नहीं हैं।

  - तेज़: अंदाज़ा लगाइए क्या? यह पायथन का उपयोग करके नहीं बनाया गया है, हम अपने मुख्य प्रोग्रामिंग भाषा के रूप में <a href='https://go.dev/'>Go</a> का उपयोग करते हैं।


  <b>वर्तमान संस्करण:</b> %s"
help_configuration_step-1: "Alita कॉन्फ़िगरेशन में आपका स्वागत है"
help_configuration_step-2: "ठीक है, बहुत अच्छा!


  अब मुझे सही ढंग से काम करने के लिए, आपको मुझे अपने ग्रुप का एडमिन बनाना होगा!

  ऐसा करने के लिए, इन आसान चरणों का पालन करें:

  ▫️ अपने ग्रुप पर जाएं

  ▫️ ग्रुप के नाम पर दबाएं

  ▫️ 'संशोधित करें' (Modify) दबाएं

  ▫️ 'एडमिनिस्ट्रेटर' (Administrator) पर दबाएं

  ▫️ 'एडमिनिस्ट्रेटर जोड़ें' (Add Administrator) दबाएं

  ▫️ आवर्धक लेंस (Magnifying Glass) दबाएं

  ▫️ @%s खोजें

  ▫️ पुष्टि करें"
