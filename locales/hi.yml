disabling_invalid_option: "मैं केवल इन विकल्पों को समझता हूं: `yes`/`no`/`on`/`off`"
disabling_extended_docs: |
  <b>मुख्य विशेषताएं:</b>
  • गैर-एडमिन उपयोगकर्ताओं के लिए विशिष्ट बॉट कमांड अक्षम करें
  • एडमिन हमेशा अक्षम कमांड को बायपास कर सकते हैं
  • अक्षम कमांड संदेशों का वैकल्पिक स्वचालित विलोपन
  • एक साथ कई कमांड अक्षम करने का समर्थन

  <b>कई कमांड अक्षम करें:</b>
  <code>/disable adminlist rules info</code>
  एक साथ <code>/adminlist</code>, <code>/rules</code>, और <code>/info</code> कमांड अक्षम करता है।

  <b>कमांड विलोपन टॉगल करें:</b>
  <code>/disabledel on</code> - अक्षम संदेश अब हटा दिए जाएंगे।
  <code>/disabledel off</code> - अक्षम संदेश अब हटाए नहीं जाएंगे।
  <code>/disabledel</code> - वर्तमान विलोपन सेटिंग जांचें।
disabling_notes_docs: |
  <b>महत्वपूर्ण नोट्स:</b>
  • <b>एडमिन बायपास:</b> अक्षम कमांड केवल गैर-एडमिन उपयोगकर्ताओं को प्रभावित करते हैं। सभी एडमिन अभी भी किसी भी कमांड का उपयोग कर सकते हैं।
  • <b>कनेक्शन समर्थन:</b> अक्षम कमांड अभी भी जुड़े हुए चैट के लिए <code>/connect</code> सुविधा के माध्यम से सुलभ हैं।
  • <b>कई कमांड:</b> <code>/disable</code> और <code>/enable</code> दोनों एक ही संदेश में कई कमांड नामों का समर्थन करते हैं।
  • <b>त्रुटि हैंडलिंग:</b> यदि कुछ कमांड अक्षम/सक्षम करने में विफल होते हैं, तो आपको सूचित किया जाएगा कि कौन से सफल हुए और कौन से विफल।

  <b>आवश्यक अनुमतियां:</b>
  • <code>/disable</code>, <code>/enable</code>, <code>/disabledel</code>: केवल एडमिन
  • <code>/disableable</code>, <code>/disabled</code>: सभी उपयोगकर्ता (लेकिन <code>/disabled</code> अक्षम किया जा सकता है)

# Extended documentation locale keys - Help module
help_extended_docs: |
  <b>नेविगेशन सिस्टम:</b>
  सहायता मॉड्यूल बॉट के मुख्य प्रवेश बिंदु और नेविगेशन प्रदान करता है। जब कोई उपयोगकर्ता निजी चैट में <code>/start</code> भेजता है, तो बॉट विभिन्न मॉड्यूल में नेविगेट करने के लिए एक इनलाइन कीबोर्ड के साथ स्वागत संदेश प्रदर्शित करता है।

  <code>/help</code> कमांड एक मॉड्यूल सूची दिखाता है। मॉड्यूल बटन पर क्लिक करने से उस मॉड्यूल के कमांड और उपयोग जानकारी प्रदर्शित होती है। जब <code>/help</code> का उपयोग समूह चैट में किया जाता है, तो बॉट समूह को अव्यवस्थित करने से बचने के लिए विस्तृत सहायता हेतु उपयोगकर्ता को एक निजी संदेश पर रीडायरेक्ट करता है।

  <code>/about</code> बॉट जानकारी, संस्करण और लिंक दिखाता है, जबकि <code>/donate</code> परियोजना का समर्थन करने के लिए दान जानकारी दिखाता है।

# Extended documentation locale keys - Devs module
devs_extended_docs: |
  <b>टीम पदानुक्रम:</b>
  डेव्स मॉड्यूल बॉट के आंतरिक टीम तक सीमित बॉट प्रबंधन और डायग्नोस्टिक कमांड प्रदान करता है। टीम के तीन स्तर हैं जिनमें घटते विशेषाधिकार स्तर हैं।

  <b>स्तर 1 — मालिक:</b> परिनियोजन पर <code>OWNER_ID</code> पर्यावरण चर के माध्यम से सेट किया जाता है। पूर्ण नियंत्रण: टीम रोस्टर प्रबंधित करें, सभी डायग्नोस्टिक कमांड, सभी टीम कमांड।

  <b>स्तर 2 — Sudo / Dev:</b> मालिक द्वारा <code>/addsudo</code> या <code>/adddev</code> के माध्यम से असाइन किया जाता है। डायग्नोस्टिक कमांड: बॉट आँकड़े, चैट जानकारी, चैट प्रबंधन।

  <b>स्तर 3 — टीम सदस्य:</b> स्वचालित रूप से मालिक + सभी sudo + सभी dev उपयोगकर्ताओं को शामिल करता है। केवल <code>/teamusers</code> के माध्यम से टीम रोस्टर देखें।

  <b>नोट:</b> Sudo और Dev की कमांड पहुंच समान है। अंतर संगठनात्मक उद्देश्यों के लिए मौजूद है।

  <b>महत्वपूर्ण:</b> ये कमांड सार्वजनिक सहायता मेनू में दिखाई नहीं देते हैं और अनधिकृत उपयोगकर्ताओं को चुपचाप अनदेखा करते हैं।

# Extended documentation locale keys - Users module
users_extended_docs: |
  <b>पृष्ठभूमि ट्रैकर:</b>
  उपयोगकर्ता मॉड्यूल एक निष्क्रिय पृष्ठभूमि मॉड्यूल है जिसमें कोई उपयोगकर्ता-सामना करने वाले कमांड नहीं हैं। यह बॉट द्वारा संसाधित हर संदेश पर चुपचाप चलता है, स्वचालित रूप से सभी संदेश प्रेषकों और सभी चैट को ट्रैक करता है जहाँ बॉट सक्रिय है।

  <b>यह क्या ट्रैक करता है:</b>
  • प्रत्येक संदेश प्रेषक के लिए उपयोगकर्ता आईडी, उपयोगकर्ता नाम और प्रदर्शन नाम
  • प्रत्येक समूह के लिए चैट आईडी और नाम जहाँ बॉट है
  • लिंक किए गए चैनलों के लिए चैनल आईडी, नाम और उपयोगकर्ता नाम

  <b>दर सीमित करना:</b>
  • उपयोगकर्ता अपडेट: प्रति <code>UserUpdateInterval</code> एक तक सीमित
  • चैट अपडेट: प्रति <code>ChatUpdateInterval</code> एक तक सीमित
  • यह डेटा को उचित रूप से वर्तमान रखते हुए अत्यधिक डेटाबेस लेखन को रोकता है

  <b>निष्क्रिय संचालन:</b>
  • हैंडलर समूह -1 पर संदेश वॉचर के रूप में चलता है (सभी कमांड हैंडलर से पहले फायर करता है)
  • कोई उपयोगकर्ता इंटरैक्शन आवश्यक नहीं — पूरी तरह से स्वचालित
  • <code>/info</code> जैसे अन्य मॉड्यूल, इस मॉड्यूल द्वारा एकत्रित डेटा पर निर्भर करते हैं

