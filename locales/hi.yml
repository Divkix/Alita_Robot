# Rose feature-parity keys (federations, log channels, extras)
federations_help_msg: |
  फ़ेडरेशन आपके सभी ग्रुप में एक साझा बैन सूची रखते हैं।

  *मालिक (PM):*
  × /newfed <name>: फ़ेडरेशन बनाएँ (हर यूज़र के लिए एक)।
  × /renamefed <name>: अपने फ़ेडरेशन का नाम बदलें।
  × /delfed: अपना फ़ेडरेशन हटाएँ (पुष्टि के साथ)।
  × /fedpromote /feddemote: फ़ेडरेशन एडमिन प्रबंधित करें।
  × /fedreason on/off: fban के लिए कारण ज़रूरी करें।
  × /fednotif on/off: fban की सूचना मालिक को PM में दें।
  × /subfed /unsubfed /fedsubs: दूसरे फ़ेडरेशन को सब्सक्राइब करें (अधिकतम 5)।
  × /fbanlist [csv|json|minicsv]: fban एक्सपोर्ट करें।
  × /importfbans: रिप्लाई की गई CSV/JSON फ़ाइल से इम्पोर्ट करें।
  × /setfedlog /unsetfedlog: फ़ेडरेशन लॉग चैट।

  *ग्रुप मालिक:*
  × /joinfed <fed_id>: इस चैट को फ़ेडरेशन से जोड़ें।
  × /leavefed: फ़ेडरेशन छोड़ें।
  × /quietfed on/off: निष्क्रिय fban सूचनाएँ छिपाएँ।

  *फ़ेडरेशन एडमिन:*
  × /fban /unfban /funban: फ़ेडरेशन बैन/अनबैन।
  × /fedstat /fbanstat: किसी यूज़र का fban जाँचें।
  × /feddemoteme <fed_id>: फ़ेडरेशन एडमिन पद छोड़ें।

  *कोई भी:*
  × /fedinfo /fedadmins /chatfed /myfeds
logchannels_help_msg: |
  एडमिन कार्रवाइयाँ एक अलग लॉग चैनल में भेजें।

  1. बॉट को किसी चैनल में एडमिन के रूप में जोड़ें।
  2. उस चैनल में /setlog भेजें।
  3. वह संदेश ग्रुप में फ़ॉरवर्ड करें।

  *एडमिन कमांड:*
  × /setlog: लॉग चैनल सेट करें (इसे चैनल में भेजें, फिर संदेश ग्रुप में फ़ॉरवर्ड करें)।
  × /unsetlog: लॉग चैनल हटाएँ।
  × /logchannel: मौजूदा लॉग चैनल दिखाएँ।
  × /logcategories: श्रेणियों की सूची।
  × /log <category>: कोई श्रेणी चालू करें।
  × /nolog <category>: कोई श्रेणी बंद करें।

  श्रेणियाँ: settings, admin, user, automated, reports, other.
