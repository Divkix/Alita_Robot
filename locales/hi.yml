settings_summary_legend: "<i>• डिफ़ॉल्ट से अलग मान को दर्शाता है। इसे बदलने के लिए दिखाया गया कमांड भेजें।</i>"
settings_picker_text: "सेटिंग्स देखने के लिए एक समूह चुनें। सूची में नहीं है? यहाँ /connect &lt;chat id&gt; या समूह में /settings भेजें।"
settings_picker_empty: "मुझे ऐसे समूह नहीं मिले जहाँ आप एडमिन हैं। मैं केवल वे समूह जानता हूँ जहाँ आपने मेरे जुड़ने के बाद लिखा है, इसलिए यहाँ /connect &lt;chat id&gt; या समूह में /settings भेजें।"
settings_picker_wait: "⏳ समूह सूची फिर से खोलने से पहले {seconds} सेकंड प्रतीक्षा करें।"
settings_open_in_pm: "इस समूह की सेटिंग्स निजी चैट में देखने के लिए बटन दबाएँ।"
