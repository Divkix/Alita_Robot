  <code>gif</code> - GIF ब्लॉक करें
  <code>url</code> - URL ब्लॉक करें
  <code>bots</code> - बॉट जोड़ने से रोकें
  <code>forward</code> - फॉरवर्ड ब्लॉक करें
  <code>game</code> - गेम ब्लॉक करें
  <code>location</code> - लोकेशन ब्लॉक करें
  <code>rtl</code> - RTL टेक्स्ट ब्लॉक करें
  <code>anonchannel</code> - चैनल संदेश ब्लॉक करें

  <b>प्रतिबंध लॉक</b> (6 प्रकार)
  <code>messages</code> - सभी संदेश ब्लॉक करें
  <code>comments</code> - गैर-सदस्य टिप्पणियां ब्लॉक करें
