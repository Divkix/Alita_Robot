owner_help_msg:
  "Operational commands restricted to the bot owner. These commands are not
  surfaced to regular users.


  Commands:

  × /stats: Display bot statistics and system info.

  × /chatinfo: Display detailed information about a chat.

  × /chatlist: Generate and send a list of all active chats.

  × /leavechat: Force the bot to leave a specified chat."
filters_help_msg:
  "Filters are case insensitive; every time someone says your trigger
  words, Alita will reply something else! This can be used to create your commands,
  if desired.


  Commands:

  - /addfilter <trigger> <reply>: Every time someone says trigger, the bot will reply
  with sentence. For multiple word filters, quote the trigger.

  - /filters: List all chat filters.

  - /rmfilter <trigger>: Stop the bot from replying to trigger.


  Examples:

  - Set a filter:

  -> /addfilter hello Hello there! How are you?

  - Set a multiword filter:

  -> /addfilter hello friend Hello back! Long time no see!

  - Set a filter that can only be used by admins:

  -> /addfilter example This filter won't  happen if a normal user says it {admin}

  - To save a file, image, gif, or any other attachment, simply reply to the file
  with:

  -> /addfilter trigger"
formatting_fillings: "<b>Fillings</b>


  You can also customise the contents of your message with contextual data. For example,
  you could mention a user by name in the welcome message, or mention them in a filter!

  You can use these to mention a user in notes too!


  <b>Supported fillings:</b>

  - <code>{first}</code>: The user's first name.

  - <code>{last}</code>: The user's last name.

  - <code>{fullname}</code>: The user's full name.

  - <code>{username}</code>: The user's username. If they don't have one, mentions
  the user instead.

  - <code>{mention}</code>: Mentions the user with their firstname.

  - <code>{id}</code>: The user's ID.

  - <code>{chatname}</code>: The chat's name.

  - <code>{rules}</code>: Adds Rules Button to Message.

  - <code>{protect}</code>: Protects the content from being shared.

  - <code>{preview}</code>: Enables previews in the messages.

  - <code>{nonotif}</code>: Disables the notification for that message."
formatting_help_msg: "Alita supports a large number of formatting options to make your messages more expressive. Take a look by clicking the buttons below!"
formatting_markdown: |
  <b>Markdown Formatting</b>

  You can format your message using <b>bold</b>, <i>italics</i>, <u>underline</u>,
  and much more. Go ahead and experiment!

  <b>Supported markdown</b>:

  - <code>`code words`</code>: Backticks are used for monospace fonts. Shows as: <code>code words</code>.

  - <code>_italic words_</code>: Underscores are used for italic fonts. Shows as: <i>italic words</i>.

  - <code>*bold words*</code>: Asterisks are used for bold fonts. Shows as: <b>bold words</b>.

  - <code>~strikethrough~</code>: Tildes are used for strikethrough. Shows as: <strike>strikethrough</strike>.

  - <code>||spoiler||</code>: Double vertical bars are used for spoilers. Shows as: <tg-spoiler>Spoiler</tg-spoiler>.

  - <code>```pre```</code>: To make the formatter ignore other formatting characters inside the text formatted with '```', will be like: <code>**bold** | *bold*</code>.

  - <code>__underline__</code>: Double underscores are used for underlines. Shows as: underline. NOTE: Some clients try to be smart and interpret it as italic. In that case, try to use your app's built-in formatting.

  - <code>[hyperlink](example.com)</code>: This is the formatting used for hyperlinks. Shows as: <a href='https://example.com/'>hyperlink</a>.

  - <code>[My Button](buttonurl://example.com)</code>: This is the formatting used for creating buttons. This example will create a button named "My button" which opens <code>example.com</code> when clicked.

  If you would like to send buttons on the same row, use the <code>:same</code> formatting.

  <b>Example:</b>

  <code>[button 1](buttonurl:example.com)</code>

  <code>[button 2](buttonurl://example.com:same)</code>

  <code>[button 3](buttonurl://example.com)</code>

  This will show button 1 and 2 on the same line, with 3 underneath.
formatting_random: |
  <b>Random Content</b>

  Another thing that can be fun, is to randomise the contents of a message. Make things
  a little more personal by changing welcome messages, or changing notes!

  How to use random contents:

  - %%%: This separator can be used to add random replies to the bot.

  For example:

  <code>hello

  %%%

  how are you</code>

  This will randomly choose between sending the first message, "hello", or the second
  message, "how are you".

  Use this to make Alita feel a bit more customised! (only works in filters/notes)

  Example welcome message:

  - Every time a new user joins, they'll be presented with one of the three messages
  shown here.

  -> /filter "hey"

  hello there <code>{first}</code>!

  %%%

  Ooooh, <code>{first}</code> how are you?

  %%%

  Sup? <code>{first}</code>
greetings_help_msg: |
  Welcome new members to your groups.

  *Admin Commands:*

  × /setwelcome `<reply/text>`: Sets the group's welcome message.

  × /welcome `<yes/no/on/off>`: Enables or disables welcomes.

  × /cleanservice `<yes/no/on/off>`: Deletes member-joined service messages.

  × /cleanwelcome `<yes/no/on/off>`: Deletes the previous welcome when a new member joins.
help_help_msg:
  "The entry point and navigation system for this private bot.

  *Navigation Commands:*

  × /start: Show the welcome message with navigation menu.

  × /help: Show help menu with module list; use /help <module> for details."
misc_help_msg:
  "× /info: Get your user info, which can be used as a reply or by passing
  a User Id or Username.

  × /id: Get the current group id. If used by replying to a message, get that user's
  id.

  × /ping: Ping the Telegram Server!

  × /stat: Gets the count of the total number of messages in the chat."
mutes_help_msg:
  "Sometimes users can be annoying and you might want to restrict them
  from sending a message to chat, this module is here to help, you can use this module
  to mute members in your group.


  *Mute Commands:* (Admin only)

  × /mute <userhandle>: mutes a user, (via a handle, or reply)

  × /unmute <userhandle>: unmutes a user. (via a handle, or reply)"
notes_help_msg: 'Save data for future users with notes!

  Notes are great to save random tidbits of information; a phone number, a nice gif,
  a funny picture - anything!

  *User commands:*

  - #notename: Retrieve a note.

  Admin commands:

  - /addnote <notename> <note text>: Save a new note called "word". Replying to a message
  will save that message. Even works on media!

  - /rmnote <notename>: Delete the associated note.

  - /clear <notename>: Delete the associated note.

  - /notes: List all notes in the current chat.

  - /clearall: Delete ALL notes in a chat. This cannot be undone.'
nsfw_help_msg: "*Configured NSFW chat only:*

  Scan messages or text for NSFW (adult/sexually explicit) content and curse words using TypeSafe AI.

  Limits: admins have 100 tokens; other members have 10. Each bucket refills over 24 hours.

  *Commands:*
  - /nsfw: Check the replied message for NSFW content and curse words.
  - /nsfw <text>: Check the provided text for NSFW content and curse words.

  *Aliases:* `/checknsfw`, `/curse`"
purges_help_msg: "*Admin only:*

  - /purge: deletes all messages between this and the replied-to message.


  *Examples*:

  - Delete all messages from the replied message, until now.

  -> `/purge`"
reports_help_msg:
  "To report a user, simply reply to their message with /report.

  You MUST reply to a message to report a user.

  *NOTE:* Reports will not be triggered if used by admins."
