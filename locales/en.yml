connections_help_msg:
  "This module allows group administrators to connect to a chat's database from private messages.

  *Commands*:

  × /connect `<chatid>`: Connect to the specified chat (admin only).

  × /disconnect: Disconnect from the current chat.

  × /connection: See information about the currently connected chat.

  You can retrieve the chat id by using the /id command in your chat."
