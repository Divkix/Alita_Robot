logchannels_examples_docs: |
  <b>Set up a log channel:</b>
  1. Add the bot to the channel as an admin that can post messages.
  2. Send <code>/setlog</code> in the channel.
  3. Within an hour, forward that /setlog message to your group.

  <b>Set up and manage it from PM:</b>
  In PM, name the group first: its ID, its @username, or the title of a group where you are an admin (case does not matter; quote a title with spaces). Nothing is posted in the group, and the channel gets only the usual settings entry.
  • <code>/setlog @mygroup @mychannel</code> - bind a channel by its @username
  • <code>/setlog -1001234567890 -1009876543210</code> - bind it by IDs
  • <code>/log @mygroup admin</code> - turn on a category
  • <code>/nolog -1001234567890 settings</code> - turn off a category
  • <code>/logchannel @mygroup</code> - show the log channel
  • <code>/unsetlog @mygroup</code> - remove it
  You must be an admin of the group and either own the channel or be its admin with permission to post messages, as posting /setlog there would need; the bot must be an admin of the channel that can post messages. When you are connected with /connect, the group may be left out: <code>/setlog @mychannel</code>. While you are connected, /setlog, /log and /nolog do not look up a title: name another group by its @username or ID. The group passes the same checks as /connect, and the connection stays as it is.

  <b>Choose what gets logged:</b>
  • <code>/logcategories</code> - list the categories
  • <code>/log admin user</code> - turn on two categories
  • <code>/nolog settings</code> - turn off one category

federations_permissions_docs: |
  <b>Fed owner:</b>
  • <code>/delfed</code> (in PM), <code>/renamefed</code>, <code>/fedpromote</code>, <code>/feddemote</code>, <code>/fedreason</code>, <code>/fednotif</code>, <code>/subfed</code>, <code>/unsubfed</code>, <code>/fedsubs</code>, <code>/setfedlog</code>, <code>/unsetfedlog</code>, <code>/fbanlist</code>, <code>/importfbans</code>

  <b>Fed admins:</b>
  • <code>/fban</code>, <code>/unfban</code>, <code>/funban</code> in a member group (in PM they act on the fed you own), <code>/feddemoteme</code>

  <b>Group creator:</b>
  • <code>/joinfed</code>, <code>/leavefed</code>

  <b>Group admins:</b>
  • <code>/quietfed</code>

  <b>Anyone:</b>
  • <code>/newfed</code> (in PM, one federation per user), <code>/fedstat</code>, <code>/fbanstat</code>, <code>/fedinfo</code>, <code>/fedadmins</code>, <code>/chatfed</code>, <code>/myfeds</code>

  <b>Bot Requirements:</b>
  • Ban users in every member chat, to enforce fbans

logchannels_permissions_docs: |
  <b>User Permissions:</b>
  • <code>/setlog</code> is sent in the channel itself, where only channel admins can post.
  • Only group admins can bind the channel by forwarding that message, and only they can use <code>/unsetlog</code>, <code>/log</code> and <code>/nolog</code>.
  • <code>/setlog</code> in PM binds the channel only for an admin of the group who owns the channel or is its admin with permission to post messages.
  • Anyone can use <code>/logchannel</code> and <code>/logcategories</code>; in PM, <code>/logchannel</code> works for a group you could connect to with <code>/connect</code>.

  <b>Bot Permissions:</b>
  • The bot must be an admin of the log channel with permission to post messages, both to see <code>/setlog</code> and to send log entries. Entries it cannot send are dropped without an error.
