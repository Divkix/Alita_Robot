# Rose feature-parity keys (federations, log channels, extras)
federations_help_msg: |
  Federations share a ban list across groups you own.

  *Owner (PM):*
  × /newfed <name>: Create a federation (one per user).
  × /renamefed <name>: Rename your federation.
  × /delfed: Delete your federation (confirm).
  × /fedpromote /feddemote <user>: Promote or demote a federation admin (reply, ID or @username).
  × /fedreason on/off: Require a reason for fbans.
  × /fednotif on/off: PM the owner on fbans.
  × /subfed /unsubfed <fed_id>: Subscribe to or unsubscribe from another federation's bans (max 5).
  × /fedsubs: List the federations yours subscribes to.
  × /fbanlist [csv|json|minicsv]: Export fbans.
  × /importfbans: Import from a replied CSV/JSON file.
  × /unsetfedlog: Clear the federation log chat.

  *Owner (in a group):*
  × /setfedlog: Make this group your federation's log chat.

  *Group owner:*
  × /joinfed <fed_id>: Join this chat to a federation.
  × /leavefed: Leave the federation.

  *Group admins:*
  × /quietfed on/off: Suppress passive fban notices.

  *Fed admins:*
  × /fban <user> [reason]: Ban a user across the federation (in a fed group; the owner can also use it in PM).
  × /unfban /funban <user>: Lift a federation ban.
  × /feddemoteme <fed_id>: Step down as a federation admin.

  *Anyone:*
  × /fedstat /fbanstat [user] [fed_id]: Check a user's fbans (yours by default); with a fed_id, show that ban's reason.
  × /fedinfo [fed_id]: Show federation info.
  × /fedadmins [fed_id]: List a federation's admins.
  × /chatfed: Show this group's federation (groups only).
  × /myfeds: List the federations you own or admin.
logchannels_help_msg: |
  Send admin actions to a dedicated log channel.

  1. Add the bot to a channel as admin.
  2. In that channel, send /setlog.
  3. Forward that message to the group.

  *Admin commands:*
  × /setlog: Set the log channel (send it in the channel, then forward the message to the group). In PM, name the group and then the channel, if you are an admin of both and the bot can post in the channel.
  × /unsetlog: Remove the log channel.
  × /log <category>: Enable a category.
  × /nolog <category>: Disable a category.

  *Anyone:*
  × /logchannel: Show the current log channel.
  × /logcategories: List categories.

  Categories: settings (log channel and raid mode changes), admin (bans, kicks, mutes, unbans and unmutes), user (/kickme and /banme), reports (user reports), automated (actions the bot takes on its own: spam database hits, antiflood and blacklist actions, the warn limit reached through blacklist warns, failed captchas, raid mode switched on by the join threshold, bots banned by the bots lock), warns (warnings admins give, remove and reset, and the warn limit their warns reach; off until turned on with /log warns), joins (members who pass the captcha; off until turned on with /log joins), other. Nothing is logged under other yet.

  From PM, name the group first in /setlog, /unsetlog, /log, /nolog and /logchannel: its title, @username or ID.
