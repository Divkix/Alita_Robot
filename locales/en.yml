antiflood_help_msg:
  "You know how sometimes, people join, send 100 messages, and ruin
  your chat? With antiflood, that happens no more!


  Antiflood allows you to take action on users that send more than x messages with no gap longer than 60 seconds between them (other members' messages don't reset the count). Actions are: ban/kick/mute


  *User commands*:

  × /flood: Get the current antiflood settings.


  *Admin commands*:

  × /setflood `<number/off/no>`: Set the number of messages after which to take action
  on a user. Set to '0', 'off', or 'no' to disable.

  × /setfloodmode `<action type>`: Choose which action to take on a user who has been
  flooding. Options: ban/kick/mute

  × /delflood `<yes/no/on/off>`: If you want bot to delete messages flooded by user."
antiflood_setflood_disabled: "Okay.

  I won't warn users for flooding."
