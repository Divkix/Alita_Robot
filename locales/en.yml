warns_help_msg: |
  <b>⚠️ Warnings</b>

  Each group chooses its warning threshold. Reaching it results in a fixed three-day ban.

  <b>Commands:</b>

  × /warn <code><reply/username/mention/userid> [reason]</code>: Warn a user.
  × /warns <code>[reply/username/mention/userid]</code>: Show a user's warnings.
  × /rmwarn <code><reply/username/mention/userid></code>: Remove the latest warning.
  × /resetwarns <code><reply/username/mention/userid></code>: Reset a user's warnings.
  × /resetallwarns: Reset every user's warnings (creator only).
  × /setwarnlimit <code><number></code>: Set the warning threshold.
  × /warnings: Show the threshold and fixed three-day-ban policy.
users_help_msg:
  "Automatic background user and chat tracker. This module has no user-facing
  commands — it silently records every message sender and chat the bot is active in.

  *What It Tracks:*

  × User IDs, usernames, and display names for every message sender.

  × Chat IDs and names for every group the bot is in.

  × Channel IDs, names, and usernames for linked channels.

  *Rate Limiting:*

  × User updates are throttled to one per UserUpdateInterval.

  × Chat updates are throttled to one per ChatUpdateInterval.

  Other modules, such as /info, depend on data collected by this module."


