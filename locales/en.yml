# Admin module extended documentation
admin_extended_docs: |
  <b>Anonymous Admin Support</b>

  The <code>/anonadmin</code> command allows group owners to toggle anonymous admin recognition:
  <code>/anonadmin on</code> - Trust anonymous admins without verification
  <code>/anonadmin off</code> - Require button verification (default)

  When disabled (the default), the bot asks for button verification before running admin actions from anonymous accounts.

  <b>How Anonymous Admin Verification Works:</b>
  1. Bot detects sender is GroupAnonymousBot
  2. Original message cached with 20-second TTL
  3. "Click to prove admin" button sent to chat
  4. Clicking user verified as admin, command executed
  5. Button expires after 20 seconds if not verified

  <b>Supported Commands:</b>
  Admin: /promote, /demote, /title, /setgtitle, /setgpic, /setgdesc
  Bans: /ban, /dban, /sban, /tban, /unban, /kick, /dkick, /skick, /restrict, /unrestrict
  Mutes: /mute, /smute, /dmute, /tmute, /unmute
  Pins: /pin, /unpin, /permapin, /unpinall
  Purges: /purge, /del, /purgefrom, /purgeto
  Warns: /warn, /swarn, /dwarn

admin_notes_docs: |
  <b>Security Notes</b>
  • All user-controlled input is HTML-escaped to prevent injection attacks
  • Admin permission changes run with proper error handling and panic recovery

# Antiflood extended docs
antiflood_notes_docs: |
  <b>Default Behavior</b>
  Antiflood is <b>disabled by default</b>. You must explicitly enable it using <code>/setflood &lt;number&gt;</code>.

# Locks module extended documentation
locks_notes_docs: |
  <b>Technical Notes</b>
  • Lock enforcement is real-time
  • Admins and approved users are exempt from all locks
  • Locks persist across bot restarts
  • Cache invalidated on updates

# Languages extended docs
languages_extended_docs: |
  <b>How It Works</b>
  • <b>Private Chats:</b> Any user can change their personal language
  • <b>Group Chats:</b> Only admins can change the group language

  Language preferences are cached for performance and stored separately for users and groups.

# Greetings extended docs
greetings_extended_docs: |
  <b>Captcha Integration</b>
  When Captcha module is enabled:
  1. New members are muted upon joining
  2. Captcha challenge sent instead of welcome
  3. After verification, welcome message is sent
  4. Failed verification applies captcha action

# Extended documentation locale keys - Notes module
notes_extended_docs: |
  <b>Features:</b>
  • <b>Text &amp; Media Support</b>: Save text messages, photos, videos, documents, and more
  • <b>Custom Buttons</b>: Add inline keyboard buttons to notes
  • <b>Formatting Options</b>: Control note visibility and behavior
  • <b>Admin-Only Notes</b>: Restrict certain notes to administrators only
  • <b>Private Notes</b>: Send notes privately to users via DM
  • <b>Web Preview Control</b>: Link previews are off by default; add <code>{preview}</code> to turn them on
  • <b>Protected Content</b>: Prevent note content from being forwarded

  <b>Note Formatting Options:</b>
  When saving a note, you can use special tags to control its behavior:
  • <code>{private}</code> - Note will only be sent via DM, never in group
  • <code>{noprivate}</code> - When fetched in a group, the note is sent in the group even if private notes are on (fetching it from PM still delivers it in PM)
  • <code>{admin}</code> - Note can only be accessed by admins
  • <code>{protect}</code> - Content cannot be forwarded
  • <code>{nonotif}</code> - Send without notification sound
  • <code>{preview}</code> - Show link previews (off by default)

  <b>Private Notes Mode:</b>
  When private notes are enabled (<code>/privatenotes on</code>), all notes are sent to users via DM instead of in the group. This keeps the group chat clean.

  Individual notes can override this behavior:
  • <code>{private}</code> - Always send privately
  • <code>{noprivate}</code> - Always send in group

  <b>Raw Note (No Formatting):</b>
  Admins can see a note's raw content without formatting (for editing):
  <code>/get notename noformat</code> or <code>#notename noformat</code>

notes_permissions_docs: |
  <b>Required Permissions:</b>
  • Save/Clear notes: Change Group Info
  • View admin notes: Admin status
  • Clear all notes: Chat Owner
  • Get regular notes: Any user
  • Bot: must be an admin for /save, /addnote, /clear, /rmnote, /notes and /saved (/get and #notename work without it)

# Extended documentation locale keys - Pins module
pins_extended_docs: |
  <b>Features:</b>

  <b>Anti-Channel Pin:</b>
  When enabled, the bot will automatically unpin any message that gets auto-pinned by a linked channel. This is useful when you want to maintain control over what gets pinned in your group.

  <b>Clean Linked:</b>
  When enabled, the bot will automatically delete any messages sent to the group from the linked channel. This keeps your group chat clean from cross-posted channel content.

  <b>Permapin:</b>
  Create custom pinned messages with:
  • Text with HTML/Markdown formatting
  • Inline buttons with URLs
  • Media attachments (photos, documents, stickers, audio, video, voice notes, video notes)

  <b>Supported via Connection:</b>
  The following commands work when connected to a chat via <code>/connect</code>:
  • <code>/antichannelpin</code>
  • <code>/cleanlinked</code>

pins_notes_docs: |
  <b>Notes:</b>
  • The <code>/unpinall</code> command shows a confirmation dialog before unpinning all messages
  • Permapin supports text, photos, documents and GIFs, stickers, audio, voice messages, videos and video notes; other message types are rejected
  • Anti-channel pin and clean linked settings are stored per-chat and persist across bot restarts

  <b>Required Permissions:</b>
  <b>Bot:</b> Must be admin with "Pin Messages" permission (and "Delete Messages" for <code>/cleanlinked</code>)
  <b>User:</b> Most commands require admin with "Pin Messages" permission

# Extended documentation locale keys - Purges module
purges_extended_docs: |
  <b>Range Deletion with purgefrom/purgeto:</b>
  When you need more control over the deletion range:

  1. Reply to the <b>first</b> message in the range:
  <code>/purgefrom</code>
  The bot will confirm the message is marked (expires after 30 seconds).

  2. Reply to the <b>last</b> message in the range:
  <code>/purgeto</code>
  All messages between the two markers (inclusive) will be deleted.

  This is useful when you can't easily scroll to the starting point or need to verify the range before deletion.

  <b>Limits and Restrictions:</b>
  • <b>Maximum messages per purge:</b> 1000 messages
  • <b>Message age limit:</b> Messages older than 48 hours may not be deletable (Telegram API restriction)
  • <b>Permissions required:</b> Both the user and the bot must have "Delete Messages" permission

purges_notes_docs: |
  <b>Notes:</b>
  • The <code>/purgefrom</code> marker expires after 30 seconds if not followed by <code>/purgeto</code>
  • Deleting large ranges uses concurrent processing for better performance
  • Status messages (showing how many messages were deleted) auto-delete after 3 seconds
  • The bot handles already-deleted messages gracefully without errors

# Extended documentation locale keys - Reports module
reports_extended_docs: |
  <b>How It Works:</b>

  <b>Reporting a Message:</b>
  1. <b>Reply to the offending message</b> with <code>/report</code> or mention <code>@admin</code>
  2. The bot sends a notification mentioning all admins who have reports enabled
  3. The notification includes action buttons for quick moderation

  <b>Admin Action Buttons:</b>
  • <b>➡ Message</b> - Link to the reported message
  • <b>⚠ Kick</b> - Kick the reported user (they can rejoin)
  • <b>⛔️ Ban</b> - Permanently ban the reported user
  • <b>❎ Delete Message</b> - Delete the reported message
  • <b>✔️ Mark Resolved</b> - Mark the report as resolved without action

  <b>Log Channel Card:</b>
  If the group has a log channel (<code>/setlog</code>) with the <code>reports</code> category on, each reported message also gets one card there, with its own <b>Ban</b>, <b>Mute</b>, <b>Delete</b> and <b>Dismiss</b> buttons. Only admins of the reported group can use them, with the same rights as in the group. The group still gets the full report with admin mentions and the buttons described above.

  In the log channel:
  • A copy of the reported message, so the evidence survives if the original is deleted. Messages that cannot be copied are quoted as text instead.
  • A card replying to that copy with the reported user, the number of members who reported the message, the last reporter and their reason, and a link to the original message.
  • Further reports of the same message update the same card; a member reporting the same message twice is counted once.
  • Once admins have decided a member's report, that member reporting the same message again gets a reply that the admins already reviewed it, with no admin mentions or buttons.
  • A card's buttons keep working while any report on it is still open; once none is, pressing them answers that the report has expired.

  Every report is also saved in the database with its reporter, target, message ID, the first 100 characters of the message text, and its status, which the buttons above record; the full message lives only in the log channel. Closed reports are deleted 90 days after they were closed, and reports nobody closed are deleted 90 days after they were made. Reports are not included in <code>/export</code>.

  <b>Auto-mute (off by default):</b>
  <code>/reports mute &lt;N&gt;</code> (N from 2 to 20) mutes a user once N different members have open reports against them, until an admin decides. A member who reports several of the user's messages counts once.
  • The mute ends on its own after 24 hours at most, even if no admin acts.
  • It never applies to admins, approved users, the bot, or anonymous and channel senders, and never replaces a restriction an admin already set.
  • Dismissing the report or deleting the message, on the log channel card or with the group buttons, lifts the mute unless the user's other open reports still reach N. Ban, kick and mute leave the user as that action put them.
  • A user is muted once until an admin decides: the same reports do not mute them again when the 24 hours end.
  • With the <code>automated</code> log category on, each auto-mute is logged to the log channel as <code>#REPORT_MUTE</code>.
  • <code>/reports mute off</code> turns it off; <code>/reports mute</code> shows the current setting.

  <b>Personal vs Group Settings:</b>
  • <b>In PM:</b> <code>/reports on/off</code> toggles whether YOU receive report notifications (needs an active /connect to a group where both you and the bot are admins)
  • <b>In Group:</b> <code>/reports on/off</code> toggles whether reporting is enabled for that group

reports_permissions_docs: |
  <b>Who Can Report?</b>
  ✅ Regular users
  ❌ Admins (no need to report to themselves)
  ❌ Blocked users
  ❌ Anonymous channels / Telegram system accounts

  <b>Who Can Be Reported?</b>
  ✅ Regular users
  ❌ The bot itself
  ❌ Admins (protected from reports)
  ❌ Anonymous channels / Telegram system accounts

# Extended documentation locale keys - Rules module
rules_extended_docs: |
  <b>Features:</b>

  <b>Private Rules:</b>
  Enable private rules (<code>/privaterules on</code>) to send rules via PM instead of in the group. This keeps the group chat clean.

  <b>Custom Rules Button:</b>
  Set a custom button text (max 30 characters):
  <code>/rulesbtn View Rules</code>

  Reset to default:
  <code>/resetrulesbtn</code>

  <b>Setting Rules:</b>
  You can set rules by providing text directly or by replying to a message:
  <code>/setrules Please be respectful to all members.</code>

  Or reply to a message:
  <code>/setrules</code>

  <b>Required Permissions:</b>
  • User commands: Available to all users
  • Admin commands: Require admin permissions in the chat

# Extended documentation locale keys - Warns module
warns_extended_docs: |
  <b>Default Settings:</b>
  • <b>Default warn limit:</b> 3 warnings
  • <b>Default warn mode:</b> mute
  • <b>Default warn expiry:</b> off (warns never expire)

  <b>Available Warn Modes:</b>
  • <code>ban</code> - Permanently ban the user from the chat
  • <code>kick</code> - Kick the user (they can rejoin)
  • <code>mute</code> - Mute the user (cannot send messages)
  • <code>tban</code> - Ban the user for the time given with the mode, e.g. <code>/setwarnmode tban 1d</code>
  • <code>tmute</code> - Mute the user for the time given with the mode, e.g. <code>/setwarnmode tmute 2h</code>

  <b>Warnings That Delete Messages:</b>
  • <code>/swarn</code> - Delete your command; the warning is still posted
  • <code>/dwarn</code> - Delete the user's message and warn them

warns_permissions_docs: |
  <b>Permission Requirements:</b>
  • <code>/warn</code>: Bot admin + User admin with restrict
  • <code>/dwarn</code>, <code>/swarn</code>: Bot admin + User admin, both with restrict and delete rights
  • <code>/rmwarn</code>, <code>/unwarn</code>: Bot admin + User admin
  • <code>/resetwarn</code>, <code>/resetwarns</code>: Bot admin + User admin
  • <code>/resetallwarns</code>: Chat owner only
  • <code>/setwarnmode</code>, <code>/setwarnlimit</code>, <code>/setwarntime</code>: Bot admin + User admin
  • <code>/warnings</code>: Bot admin + User admin
  • <code>/warns</code>: Any user (disableable)

warns_notes_docs: |
  <b>Notes:</b>
  • When a user reaches the warn limit, the configured action (ban/kick/mute/tban/tmute) is applied automatically
  • Warning reasons are stored and displayed when checking a user's warns
  • The <code>/warns</code> command is the only command in this module that can be disabled by admins
  • Anonymous channel posts cannot be warned
  • Admins cannot be warned

# Extended documentation locale keys - Mutes module
mutes_extended_docs: |
  <b>Time Format for Temporary Mutes:</b>
  • <code>m</code> = minutes (e.g., <code>30m</code>)
  • <code>h</code> = hours (e.g., <code>2h</code>)
  • <code>d</code> = days (e.g., <code>1d</code>)
  • <code>w</code> = weeks (e.g., <code>1w</code>)

  <b>Mute Variants:</b>
  • <code>/mute</code> - Standard mute with optional reason
  • <code>/smute</code> - Silent mute (deletes your command message)
  • <code>/dmute</code> - Delete-mute (mutes user and deletes their message)
  • <code>/tmute</code> - Temporary mute with specified duration

  <b>Required Permissions:</b>
  <b>Admin only commands.</b> Users executing these commands must have:
  • Admin status in the chat
  • Permission to restrict members
  • Permission to delete messages (for <code>/smute</code> and <code>/dmute</code>)

  The bot must also have admin privileges with permission to restrict members, plus permission to delete messages for <code>/smute</code> and <code>/dmute</code>.

# Extended documentation locale keys - Filters module
filters_extended_docs: |
  <b>Advanced Features:</b>

  <b>Random Responses:</b>
  Use <code>%%%</code> to separate multiple responses. One will be picked randomly:
  <code>/filter hello Hi there!%%%Hello!%%%Hey, how are you?</code>

  <b>Media Filters:</b>
  Reply to any media (photo, video, document, sticker, etc.) with <code>/filter trigger</code> to create a filter that sends that media.

  <b>Noformat Mode:</b>
  Admins can view the raw filter content (including formatting codes) by adding <code>noformat</code> after the trigger:
  <code>hello noformat</code>
  This is useful for debugging filters or seeing button configurations.

  <b>Filter Buttons:</b>
  You can add inline buttons to your filters:
  <code>/filter hello Hello! Check out these links:
  [Button 1](buttonurl:https://example.com)
  [Button 2](buttonurl:https://example2.com)</code>

# Extended documentation locale keys - Captcha module
captcha_extended_docs: |
  <b>How It Works:</b>
  1. When captcha is enabled, new members are automatically muted upon joining
  2. A captcha challenge is sent to the new member
  3. The user must select the correct answer from the provided options
  4. If successful, the user is unmuted and can participate in the group
  5. If they fail or timeout, the configured action is taken (kick, ban, or mute)

  <b>Captcha Types:</b>
  • <b>Math</b>: Solve simple arithmetic problems (addition, subtraction, multiplication)
  • <b>Text</b>: Identify text shown in a distorted image

  <b>Pending Messages Feature:</b>
  When a user is completing the captcha, any messages they try to send are stored and deleted. Admins can:
  • View what messages a user tried to send using <code>/captchapending</code>
  • Clear stored messages using <code>/captchaclear</code>

  This helps identify potential spam attempts before users complete verification.

captcha_permissions_docs: |
  <b>Bot Requirements:</b>
  • Ban users (for kick/ban actions)
  • Restrict members (for muting during verification)
  • Delete messages (for cleaning up captcha messages)

  <b>Failure Actions:</b>
  • <code>kick</code> - Remove the user while allowing them to rejoin
  • <code>ban</code> - Permanently ban the user
  • <code>mute</code> - Keep the user muted for 24 hours

# Extended documentation locale keys - Blacklists module
blacklists_extended_docs: |
  <b>Available Actions:</b>
  The following actions can be set using <code>/blaction</code>:
  • <code>none</code> - Just deletes the message without any further action
  • <code>warn</code> - Deletes message and issues a warning to the user (default)
  • <code>mute</code> - Deletes message and mutes the user
  • <code>kick</code> - Deletes message and kicks the user (they can rejoin)
  • <code>ban</code> - Deletes message and permanently bans the user

  <b>Note:</b>
  The Default mode for Blacklist is <b>warn</b>, which will delete the message and issue a warning to the user.

  <b>Commands:</b>
  • <code>/addblacklist &lt;trigger&gt;</code> - Blacklists the word in the current chat
  • <code>/rmblacklist &lt;trigger&gt;</code> - Removes the word from current Blacklisted Words in Chat
  • <code>/blaction &lt;mute/kick/ban/warn/none&gt;</code> - Sets the action to be performed by bot when a blacklist word is detected
  • <code>/remallbl</code> - Removes all the blacklisted words from chat (Owner Only)

# Extended documentation locale keys - Disabling module
disabling_extended_docs: |
  <b>Key Features:</b>
  • Disable specific bot commands for non-admin users
  • Admins can always bypass disabled commands
  • Optional automatic deletion of disabled command messages
  • Support for disabling multiple commands at once

  <b>Disable Multiple Commands:</b>
  <code>/disable adminlist rules info</code>
  Disables <code>/adminlist</code>, <code>/rules</code>, and <code>/info</code> commands at once.

  <b>Toggle Command Deletion:</b>
  <code>/disabledel on</code> - Disabled messages will now be deleted.
  <code>/disabledel off</code> - Disabled messages will no longer be deleted.
  <code>/disabledel</code> - Check the current deletion setting.

disabling_notes_docs: |
  <b>Important Notes:</b>
  • <b>Admin Bypass:</b> Disabled commands only affect non-admin users. All admins can still use any command.
  • <b>Connection Support:</b> Disabled commands are still accessible through the <code>/connect</code> feature for connected chats.
  • <b>Multiple Commands:</b> Both <code>/disable</code> and <code>/enable</code> support multiple command names in a single message.

  <b>Required Permissions:</b>
  • <code>/disable</code>, <code>/enable</code>, <code>/disabledel</code>: Admin only
  • <code>/disableable</code>, <code>/disabled</code>: All users (but <code>/disabled</code> can be disabled)

# Extended documentation locale keys - Help module
help_extended_docs: |
  <b>Navigation System:</b>
  The Help module provides the bot's main entry points and navigation. When a user sends <code>/start</code> in a private chat, the bot displays a welcome message with an inline keyboard for navigating to different modules.

  The <code>/help</code> command shows a module list. Clicking a module button displays that module's commands and usage information. When <code>/help</code> is used in a group chat, the bot redirects the user to a private message for detailed help to avoid cluttering the group.

  <code>/about</code> shows bot information, version, and links, while <code>/donate</code> shows donation information for supporting the project.

  <code>/extend</code> sends every command of every module in one list; in a group it replies with a button that opens the list in PM.

# Extended documentation locale keys - Devs module
devs_extended_docs: |
  <b>Team Hierarchy:</b>
  The Devs module provides bot management and diagnostic commands restricted to the bot's internal team. The team has three tiers with descending privilege levels.

  <b>Tier 1 — Owner:</b> Set via <code>OWNER_ID</code> environment variable at deployment. Full control: manage team roster, all diagnostic commands, all team commands.

  <b>Tier 2 — Dev:</b> Assigned by owner via <code>/adddev</code>. Has diagnostic command access: <code>/stats</code>, <code>/chatinfo</code>, <code>/chatlist</code>, <code>/leavechat</code>. Also listed in <code>/teamusers</code>, and marked as a dev user in <code>/info</code>.

  <b>Tier 2 — Sudo:</b> Assigned by owner via <code>/addsudo</code>. Listed in <code>/teamusers</code> but does NOT have diagnostic command access.

  <b>Promotions:</b> When a Dev or Sudo user who is a chat admin with the right to add admins uses <code>/promote</code>, the new admin gets every admin right the bot holds, even ones the promoter lacks. The chat's creator gets the same treatment. Other admins can only pass on rights they hold themselves.

  <b>Tier 3 — Team Member:</b> Automatically includes owner + all sudo + all dev users. View team roster only via <code>/teamusers</code>.

  <b>Note:</b> Of the commands in this module, Sudo users can use only <code>/teamusers</code>. <code>/stats</code>, <code>/chatinfo</code>, <code>/chatlist</code>, and <code>/leavechat</code> require Dev or Owner.

  <b>Important:</b> These commands are not visible in the public help menu and silently ignore unauthorized users.

# Extended documentation locale keys - Users module
users_extended_docs: |
  <b>Background Tracker:</b>
  The Users module is a passive background module with no user-facing commands. It runs silently on every message the bot processes, automatically tracking all message senders and all chats the bot is active in.

  <b>What It Tracks:</b>
  • User IDs, usernames, and display names for every message sender
  • Chat IDs and names for every group the bot is in
  • Channel IDs, names, and usernames for linked channels

  <b>Rate Limiting:</b>
  • User, chat and channel records: refreshed at most once an hour
  • A changed name, username or chat title is saved straight away
  • This prevents excessive database writes while keeping data reasonably current

  <b>Passive Operation:</b>
  • Runs as a message watcher at handler group -1 (fires before all command handlers)
  • No user interaction required — fully automatic
  • Other modules, such as <code>/info</code>, depend on data collected by this module

