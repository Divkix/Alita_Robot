disabling_help_msg:
  "This module allows you to disable some commonly used commands,
  So, no one can use them. It'll also allow you to autodelete them, stopping people
  from blue texting.


  *User commands*:

  × /disableable: List all disableable commands.

  × /disabled: List the disabled commands in this chat.


  *Admin commands*:

  × /disable `<commandname>`: Stop users from using commandname in this group.

  × /enable `<commandname>`: Allow users to use commandname in this group again.

  × /disabledel `<yes/no/on/off>`: Delete disabled commands when used by non-admins.


  Note:

  When disabling a command, the command only gets disabled for non-admins. All admins
  can still use those commands.

  Disabled commands are still accessible through the /connect feature. If you would
  be interested to see this disabled too, let me know in the support chat."
devs_help_msg:
  "Bot management and diagnostic commands restricted to the bot owner and
  trusted developers. These commands are not surfaced to regular users.

  *Team Commands:*

  × /teamusers: List all team members.

  *Owner Commands:*

  × /addsudo: Grant sudo permissions to a user.

  × /adddev: Grant developer permissions to a user.

  × /remsudo: Revoke sudo permissions from a user.

  × /remdev: Revoke developer permissions from a user.

  *Diagnostic Commands:*

  × /stats: Display bot statistics and system info.

  × /chatinfo: Display detailed information about a chat.

  × /chatlist: Generate and send a list of all active chats.

  × /leavechat: Force the bot to leave a specified chat."
filters_help_msg:
  "Filters are case insensitive; every time someone says your trigger
  words, Alita will reply something else! This can be used to create your commands,
  if desired.


  Commands:

  - /filter <trigger> <reply>: Every time someone says trigger, the bot will reply
  with sentence. For multiple word filters, quote the trigger.

  - /filters: List all chat filters.

  - /stop <trigger>: Stop the bot from replying to trigger.

  - /stopall: Stop ALL filters in the current chat. This action cannot be undone.


  Examples:

  - Set a filter:

  -> /filter hello Hello there! How are you?

  - Set a multiword filter:

  -> /filter \"hello friend\" Hello back! Long time no see!

  - To save a file, image, gif, or any other attachment, simply reply to the file
  with:

  -> /filter trigger"
formatting_fillings: "<b>Fillings</b>


  You can also customise the contents of your message with contextual data. For example,
  you could mention a user by name in the welcome message, or mention them in a filter!

  You can use these to mention a user in notes too!


  <b>Supported fillings:</b>

  - <code>{first}</code>: The user's first name.

  - <code>{last}</code>: The user's last name.

  - <code>{fullname}</code>: The user's full name.

  - <code>{username}</code>: The user's username. If they don't have one, mentions
  the user instead.

  - <code>{mention}</code>: The same as <code>{username}</code> (the user's @username, or a mention by first name if they have none).

  - <code>{id}</code>: The user's ID.

  - <code>{chatname}</code>: The chat's name.

  - <code>{count}</code>: The chat's member count.

  - <code>{rules}</code>: Adds a Rules button below the message's other buttons (only if the chat has rules set). Use <code>{rules:same}</code> to put it on the same row as the previous button, or <code>{rules:up}</code> to put it before all other buttons.

  - <code>{protect}</code>: Protects the content from being shared (notes only).

  - <code>{preview}</code>: Enables link previews (notes only).

  - <code>{nonotif}</code>: Disables the notification for that message (notes only)."
formatting_help_msg: "Alita supports a large number of formatting options to make your messages more expressive. Take a look by clicking the buttons below!

  *User commands*:

  × /markdownhelp: Show the formatting guide. In a group, it replies with a button that opens the guide in PM.

  × /formatting: Same as /markdownhelp."
formatting_markdown: |
  <b>Markdown Formatting</b>

  You can format your message using <b>bold</b>, <i>italics</i>, <u>underline</u>,
  and much more. Go ahead and experiment!

  <b>Supported markdown</b>:

  - <code>`code words`</code>: Backticks are used for monospace fonts. Shows as: <code>code words</code>.

  - <code>_italic words_</code>: Underscores are used for italic fonts. Shows as: <i>italic words</i>.

  - <code>*bold words*</code>: Asterisks are used for bold fonts. Shows as: <b>bold words</b>.

  - <code>~strikethrough~</code>: Tildes are used for strikethrough. Shows as: <strike>strikethrough</strike>.

  - <code>||spoiler||</code>: Double vertical bars are used for spoilers. Shows as: <tg-spoiler>Spoiler</tg-spoiler>.

  - <code>```pre```</code>: To make the formatter ignore other formatting characters inside the text formatted with '```', will be like: <code>**bold** | *bold*</code>.

  - <code>__underline__</code>: Double underscores are used for underlines. Shows as: underline. NOTE: Some clients try to be smart and interpret it as italic. In that case, try to use your app's built-in formatting.

  - <code>[hyperlink](example.com)</code>: This is the formatting used for hyperlinks. Shows as: <a href='https://example.com/'>hyperlink</a>.

  - <code>[My Button](buttonurl://https://example.com)</code>: This is the formatting used for creating buttons. This example will create a button named "My button" which opens <code>https://example.com</code> when clicked. The link must start with <code>http://</code> or <code>https://</code>, or no button is created.

  If you would like to send buttons on the same row, use the <code>:same</code> formatting.

  <b>Example:</b>

  <code>[button 1](buttonurl:https://example.com)</code>

  <code>[button 2](buttonurl://https://example.com:same)</code>

  <code>[button 3](buttonurl://https://example.com)</code>

  This will show button 1 and 2 on the same line, with 3 underneath.
formatting_random: |
  <b>Random Content</b>

  Another thing that can be fun, is to randomise the contents of a message. Make things
  a little more personal by randomising filter replies or notes!

  How to use random contents:

  - %%%: This separator can be used to add random replies to the bot.

  For example:

  <code>hello

  %%%

  how are you</code>

  This will randomly choose between sending the first message, "hello", or the second
  message, "how are you".

  Use this to make Alita feel a bit more customised! (only works in filters/notes)

  Example filter:

  - Every time someone says "hey", the bot replies with one of the three messages
  shown here.

  -> /filter "hey"

  hello there <code>{first}</code>!

  %%%

  Ooooh, <code>{first}</code> how are you?

  %%%

  Sup? <code>{first}</code>
greetings_help_msg:
  "Welcome new members to your groups or say Goodbye after they
  leave!


  *Admin Commands:*

  × /setwelcome `<reply/text>`: Sets welcome text for group.

  × /welcome `<yes/no/on/off/noformat>`: With no argument, shows the welcome settings and a preview of the welcome message. on/off enables or disables welcome; noformat shows the preview with placeholders unfilled and button codes instead of buttons.

  × /resetwelcome: Resets the welcome message to default.

  × /setgoodbye `<reply/text>`: Sets goodbye text for group.

  × /goodbye `<yes/no/on/off/noformat>`: With no argument, shows the goodbye settings and a preview of the goodbye message. on/off enables or disables goodbye; noformat shows the preview with placeholders unfilled and button codes instead of buttons.

  × /resetgoodbye: Resets the goodbye message to default.

  × /cleanservice `<yes/no/on/off>`: Delete join and leave service messages, such as the 'x joined the group' notification.

  × /cleanwelcome `<yes/no/on/off>`: Delete the old welcome message, whenever a new
  member joins.

  × /cleangoodbye `<yes/no/on/off>`: Delete the old goodbye message, whenever a member leaves.

  × /autoapprove `<yes/no/on/off>`: Automatically approve chat join requests."
help_about: "@%s  is one of the fastest and most feature-filled group managers.


  Alita ✨ is developed and actively maintained by @DivideProjects!


  Alita has been online since 2020 and has served thousands of groups with hundreds
  of thousands of users!


  <b>Why Alita:</b>

  - Simple: Easy usage and compatible with many bot commands.

  - Featured: Many features which other group management bots don't have.

  - Fast: Guess what? It's not made using Python, we use <a href='https://go.dev/'>Go</a>
  as our core programming language.


  <b>Current Version:</b> %s"
help_configuration_step-1: "Welcome to the Alita Configuration


  The first thing to do is to add Alita ✨ to your group! For doing that, press the
  under button and select your group, then press Done to continue the tutorial."
help_configuration_step-2: "Ok, well done!


  Now to let me work correctly, you need to make me Admin of your Group!

  To do that, follow these easy steps:

  ▫️ Go to your group

  ▫️ Press the Group's name

  ▫️ Press Modify

  ▫️ Press on Administrator

  ▫️ Press Add Administrator

  ▫️ Press the Magnifying Glass

  ▫️ Search @%s

  ▫️ Confirm"
help_configuration_step-3: "Excellent!


  Now the Bot is ready to use!

  All commands start with /


  If you're facing any difficulties in setting up me in your group, so don't hesitate
  to come in @DivideSupport.

  We would love to help you."
help_donatetext: "So you want to donate? Amazing!

  When you donate, all the fund goes towards my development which makes on fast and
  responsive.

  Your donation might also get me a new feature or two, which I wasn't able to get
  due to server limitations.

  All the funds would be put into my services such as database, storage, and hosting!

  You can donate by contacting my owner here: @DivideProjectsBot"
language_flag: 🇺🇸
language_name: English
help_help_msg:
  "The main entry point and navigation system for Alita Robot.

  *Navigation Commands:*

  × /start: Show the welcome message with navigation menu.

  × /help: Show help menu with module list; use /help <module> for details.

  × /about: Show bot information, version, and useful links.

  × /donate: Show donation information for supporting the project.

  × /extend: Send every command of every module in one list; in groups, sends a button to get it in PM."
languages_help_msg: "Not able to change language of the bot?

  Easily change by using this module!


  Just type /lang and use inline keyboard to choose a language for yourself or your
  group.

  In PM, an admin connected to a group can use /lang group to change that group's language.


  × /lang: Change the bot language for you or the group.


  You can help us bring bot to more languages by helping on [Crowdin](https://crowdin.com/project/alita_robot)"
locks_help_msg: "*Admin only*:

  × /lock `<type> [type ...]`: Lock one or more lock types (see /locktypes).

  × /unlock `<type> [type ...]`: Unlock one or more lock types.

  × /locks: View Chat permission.


  *User Commands:*

  × /locktypes: Check available lock types!


  Locks can be used to restrict a group's users.

  Locking URLs will auto-delete all messages with URLs, locking stickers will delete
  all stickers, etc.

  Locking bots will stop users who are neither admins nor approved from adding bots to the chat.


  **Example:**

  `/lock media`: this locks all the media messages in the chat."
misc_help_msg:
  "× /info: Get your user info, which can be used as a reply or by passing
  a User Id or Username.

  × /id [user]: Get your ID, and the group's ID when used in a group. Pass a username or user ID, or reply to a message, to get that user's ID (a reply also shows forwarded-from, GIF and sticker IDs).

  × /ping: Ping the Telegram Server!

  × /tr <lang code> <text>: Translate the text. Reply to a message with /tr [lang code] to translate it (English if no code is given).

  × /removebotkeyboard: Removes the stuck bot keyboard from your chat.

  × /stat: Gets the count of the total number of messages in the chat.

  × /tell <text>: (admin, groups only) Reply to a message to make the bot send <text> as a reply to it; your command message is deleted.

  × /stickerid: Reply to a sticker to get its file ID.

  × /zombies: Kick deleted accounts the bot knows about (admin).

  × /github <user|user/repo>: Look up a GitHub user or repository.

  × /wiki <search>: Search English Wikipedia.

  × /ud <term>: Look up Urban Dictionary.

  × /runs: A random quip."
mutes_help_msg:
  "Sometimes users can be annoying and you might want to restrict them
  from sending a message to chat, this module is here to help, you can use this module
  to mute members in your group.


  *Mute Commands:* (Admin only)

  × /mute <userhandle>: mutes a user, (via a handle, or reply)

  × /smute <userhandle>: mutes a user silently, does not send a message to the group,
  and also deletes your command. (via a handle, or reply)

  × /dmute [reason]: mutes the sender of the replied message and deletes that message. (reply only)

  × /tmute <userhandle> x(m/h/d/w): mutes a user for `x` time. (via a handle, or reply).
  m = minutes, h = hours, d = days, w = weeks.

  × /unmute <userhandle>: unmutes a user. (via a handle, or reply)"
notes_help_msg: 'Save data for future users with notes!

  Notes are great to save random tidbits of information; a phone number, a nice gif,
  a funny picture - anything!

  *User commands:*

  - /get <notename>: Get a note.

  - #notename: Same as /get.

  - /notes: List all notes in the current chat.

  - /saved: Same as /notes.

  Admin commands:

  - /save /addnote <notename> <note text>: Save a new note called "word". Replying to a message
  will save that message. Even works on media!

  - /clear /rmnote <notename>: Delete the associated note.

  - /clearall: Delete ALL notes in a chat (chat owner only). This cannot be undone.

  - /privatenotes /privnote <on/off>: Whether or not to send notes in PM. Will send a message with a
  button which users can click to get the note in PM. Without an argument, shows the current setting.'
pins_help_msg:
  "All the pin-related commands can be found here; keep your chat up
  to date on the latest news with a simple pinned message!


  *User commands:*

  × /pinned: Get the current pinned message.


  *Admin commands:*

  × /pin: Pin the message you replied to. Add 'loud', 'notify' or 'violent' to send a notification
  to group members.

  × /pinned: Gets the latest pinned message in the current Chat.

  × /permapin <text>: Pin a custom message through the bot. This message can contain
  markdown, buttons, and all the other cool features.

  × /unpin: Unpin the current pinned message. If used as a reply, unpins the replied-to
  message.

  × /unpinall: Unpins all pinned messages.

  × /antichannelpin <yes/no/on/off>: Don't let telegram auto-pin linked channels.
  If no arguments are given, show the current setting.

  × /cleanlinked <yes/no/on/off>: Delete messages sent by the linked channel."
purges_help_msg: "*Admin only:*

  - /purge <reason>: deletes all messages between this and the replied-to message. The reason is optional and is shown in the confirmation.

  - /del: deletes the message you replied to.

  - /purgefrom: marks the replied-to message as the start of a range to delete (then use /purgeto).

  - /purgeto <reason>: deletes every message from the /purgefrom mark up to the replied-to message. The reason is optional and is shown in the confirmation.


  *Examples*:

  - Delete all messages from the replied message, until now.

  -> `/purge`"
reports_help_msg:
  "We're all busy people who don't have time to monitor our groups
  24/7. But how do you react if someone in your group is spamming?


  × /report `<reason>`: reply to a message to report it to admins.

  - @admin / @admins: same as /report but not a command.


  *Admins Only:*

  × /reports `<on/off/yes/no/true/false>`: change report setting, or view current status.

  - If done in PM, toggles your status. This needs an active /connect to a group where both you and the bot are admins.

  - If in a group, toggles that group's status.

  × /reports `block` (via reply only): Block a user from using /report or @admin.

  × /reports `unblock` (via reply only): Unblock a user from using /report or @admin.

  × /reports `showblocklist`: Check all the blocked users who cannot use /report or
  @admin.

  × /reports `mute <N>` / `mute off`: mute a user once N (2-20) different members have open reports against them, until an admin decides and for at most 24 hours. Off by default; never applies to admins or approved users.


  To report a user, simply reply to his message with @admin or /report; Alita will
  then reply with a message stating that admins have been notified.

  You MUST reply to a message to report a user; you can't just use @admin to tag
  admins for no reason!


  *NOTE:* Neither of these will get triggered if used by admins."
rules_help_msg:
  "Every chat works with different rules; this module will help make
  those rules clearer!

  *User commands*:

  × /rules: Check the current chat rules.

  *Admin commands*:

  × /setrules `<text>`: Set the rules for this chat.

  × /privaterules `<yes/no/on/off>`: Enable/disable whether the rules should be sent
  in private.

  × /resetrules: Reset the chat rules to default

  × /rulesbtn `<custom text>`: Sets the text of the rules button.

  × /resetrulesbutton: Reset the text of the rules button to default.

  × /resetrulesbtn: Same as above."
bot_updates_creators_plug: "\nFollow @DivideProjects for more useful bots from my creators."
bot_updates_make_me_admin: "\n\nMake me admin to use me with my full abilities!"
warns_help_msg:
  "Keep your members in check with warnings; stop them getting out of
  control!

  If you're looking for automated warnings, read about the blacklist module!


  *User Commands:*

  - /warns [user]: See your own warnings, or another user's.


  *Admin Commands:*

  - /warn <reason>: Warn a user.

  - /dwarn <reason>: Warn a user by reply, and delete their message.

  - /swarn <reason>: Warn a user and delete your command message; the warning is still posted.

  - /rmwarn: Remove a user's latest warning.

  - /resetwarns: Reset all of a user's warnings to 0.

  - /resetallwarns: Delete all the warnings in a chat. All users return to 0 warns. (creator only)

  - /warnings: Get the chat's warning settings.

  - /setwarnmode <ban/kick/mute/tban/tmute> [time]: Set the chat's warn mode.

  - /setwarntime <time/off>: Set how long a warn counts, e.g. 30d; off keeps warns forever. Warns issued before the bot recorded warn times never expire; /resetwarns removes them.

  - /setwarnlimit <number>: Set the number of warnings before users are punished.


  *Examples*

  - Warn a user.

  -> `/warn @user For disobeying the rules`"
users_help_msg:
  "Automatic background user and chat tracker. This module has no user-facing
  commands — it silently records every message sender and chat the bot is active in.

  *What It Tracks:*

  × User IDs, usernames, and display names for every message sender.

  × Chat IDs and names for every group the bot is in.

  × Channel IDs, names, and usernames for linked channels.

  *Rate Limiting:*

  × User, chat and channel records are refreshed at most once an hour, or straight away when a name, username or chat title changes.

  Other modules, such as /info, depend on data collected by this module."

