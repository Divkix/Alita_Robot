aispam_breaker_notice: "⚠️ AI spam checks are paused in this chat for a few minutes after repeated failures from the AI provider. They resume on their own, and the filter stays on."

# Spam database join check strings
spamdb_help_msg: |
  <b>🛡 Spam Database</b>

  An opt-in check that looks every new member up in spam databases when they join, and acts on the ones they list. CAS (cas.chat) is checked by default; lols.bot and the bot's own Shared bans network can be added.

  Admins, approved users and bots are never checked. If a database cannot be reached, the member is let in. Each action is reported to the log channel only, never in the group.


  *Admin commands:*

  × /spamdb: Show whether the check is on, which databases it asks and what it does.

  × /spamdb `<on/off>`: Turn the check on or off for this chat.

  × /spamdb db `<cas/lols/shared>` `<on/off>`: Choose the databases. CAS is on by default, and at least one must stay on. lols.bot lists accounts more aggressively, so expect more false positives. Shared bans is off by default, needs the operator's shared reputation network, and lists users several chats removed recently.

  × /spamdb action `<ban/mute/log>`: Choose what happens to a listed member. The default is ban; log only reports them.


  The check is off in every chat until an admin turns it on. Turning it on sends the Telegram user ID of every new member to each selected external database (cas.chat, lols.bot). Shared bans stays inside the bot and sends nothing.
