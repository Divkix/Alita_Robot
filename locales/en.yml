# Backup/Restore module strings
backup_help_msg: |
  <b>📦 Backup & Restore</b>

  Backup and restore your group settings using these commands:

  <b>User Commands:</b>
  • /export - Export all supported domains to a JSON file
  • /export notes filters welcome - Export specific domains only

  <b>Creator Commands:</b>
  • /import - Reply to a backup file to restore settings
  • /import notes filters - Import only specific domains
  • /reset - Reset all supported domains to default
  • /reset warnings filters - Reset specific domains only

  <b>Supported domains:</b>
  antiflood, antiraid, approvals, blacklists, connections, filters, welcome, notes, reactions, warnings

  <b>Rate Limits:</b>
  • Export: 1 per 5 minutes
  • Import: 1 per 10 minutes
  • Reset: 1 per hour

backup_export_button: "📤 Export"
backup_import_button: "📥 Import"
