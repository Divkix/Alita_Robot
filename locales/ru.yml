bans_help_msg:
  "Иногда пользователи могут раздражать, и вы можете захотеть удалить их
    из чата, этот модуль как раз помогает вам справиться с этим!.
  
    Баньте/выгоняйте пользователей из чата, и разбаньте их позже, если они ведут себя хорошо.
  
  
    *Пользовательские команды:*
  
    × /kickme: Выгоняет пользователя, который использовал команду.

    × /banme: Банит пользователя, который использовал команду.
  
  
    *Команды бана* (только для администратора):
  
    × /ban <userhandle>: банит пользователя. (через ник, или ответ)
  
    × /sban <userhandle>: банит пользователя без звука, не отправляет сообщение в группу, а также удаляет вашу команду. (через ник, или ответ)
  
    × /kick <userhandle>: выгоняет пользователя. (через ник, или ответ)

    × /skick <userhandle>: выгоняет пользователя без звука и удаляет вашу команду.

    × /dkick: выгоняет пользователя и удаляет ответное сообщение. (только ответом)

    × /dban <userhandle>: банит пользователя и удаляет ответное сообщение. (через ник, или ответ)
  
    × /tban <userhandle> x(m/h/d): банит пользователя на `x` время. (через ник, или ответ).
    m = минуты, h = часы, d = дни.
  
    × /unban <userhandle>: разбанивает пользователя. (через ник, или ответ)

    × /unbanall: только для владельца — с подтверждением разбанивает известных пользователей.
  
  
    *Команды ограничения:* (только для администратора)
  
    × /restrict: Показывает InlineKeyboard для выбора вариантов: kick, ban и mute
  
    × /unrestrict: Показывает InlineKeyboard для выбора вариантов: unmute и unban."
