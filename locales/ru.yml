# AntiRaid module strings
antiraid_help_msg: |
  Защитите вашу группу от спам-атак с помощью AntiRaid.
  *Команды администратора:*
  /antiraid: Показать текущее состояние + кнопки включения/выключения.
  /antiraid on: Включить режим рейда на настроенное время.
  /antiraid <duration>: Включить на заданное время (например, 3h, 30m).
  /antiraid off: Немедленно отключить режим рейда.
  /raidtime <time>: Установить длительность рейда (по умолчанию: 6h).
  /raidactiontime <time>: Установить длительность временного бана (по умолчанию: 1h).
  /autoantiraid <N>: Авто-включение при N+ входов/мин.
  /autoantiraid off: Отключить авто-триггер.
