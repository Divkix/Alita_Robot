help_bot_intro: "Привет! Меня зовут Alita ✨.\nЯ здесь, чтобы помочь вам управлять вашими группами!\nНажмите /help, чтобы узнать больше о том, как использовать меня на полную.\n"
help_pm_intro: |
  Привет %s!
  Меня зовут Alita ✨.

  Я бот для управления группами, здесь, чтобы помочь вам разобраться и поддерживать порядок в ваших группах!
  У меня много удобных функций, таких как контроль флуда, система предупреждений, система хранения заметок и даже заранее заданные ответы на определённые ключевые слова.

  Полезные команды:
  - /start: Запускает меня! Вы, вероятно, уже использовали это.
  - /help: Отправляет это сообщение; Я расскажу вам больше о себе!
  - /donate: Даёт вам информацию о том, как поддержать меня и моего создателя.

  Если у вас есть какие-либо баги или вопросы о том, как использовать меня, посмотрите на мой сайт или зайдите в @DivideSupport.
  Все команды можно использовать с / или !.

help_help_msg:
  "Главная точка входа и система навигации для Alita Robot.

  *Команды навигации:*

  × /start: Показать приветственное сообщение с меню навигации.

  × /help: Показать меню помощи со списком модулей; используйте /help <модуль> для подробностей.

  × /about: Показать информацию о боте, версию и полезные ссылки.

  × /donate: Показать информацию о пожертвованиях для поддержки проекта."
languages_help_msg:
  "Не можете изменить язык бота?
  
    Легко изменить, используя этот модуль!
  
  
    Просто введите /lang и используйте встроенную клавиатуру, чтобы выбрать язык для себя или вашей группы.
  
    В личке админ, подключённый к группе, может командой /lang group сменить язык этой группы.


  × /lang: Сменить язык бота для вас или группы.
  
  
    Вы можете помочь нам принести бота на больше языков, помогая на [Crowdin](https://crowdin.com/project/alita_robot)"
locks_help_msg: "*Только для администратора*:\n× /lock `<permission>`: Заблокировать разрешение чата..\n× /unlock `<permission>`: Разблокировать разрешение чата.\n× /locks: Просмотреть разрешения чата.\n× /locktypes: Проверить доступные типы блокировок!\n\nБлокировки могут использоваться для ограничения пользователей группы.\nБлокировка URL-адресов будет автоматически удалять все сообщения с URL-адресами, блокировка стикеров будет удалять все стикеры и т.д.\nБлокировка ботов остановит не-администраторов от добавления ботов в чат.\n\n**Пример:**\n`/lock media`: это блокирует все медиа-сообщения в чате."
misc_help_msg:
  "× /info: Получить вашу информацию о пользователе, которую можно использовать как ответ или передав ID пользователя или Имя пользователя.
  
    × /id: Получить текущий ID группы. Если используется с ответом на сообщение, получить ID этого пользователя.
  
    × /ping: Проверить связь с сервером Telegram!
  
    × /tr <lang code> <msg/reply to message>: Перевести сообщение.
  
    × /removebotkeyboard: Удаляет зависшую клавиатуру бота из вашего чата.
  
    × /stat: Получает количество общего числа сообщений в чате.

  × /stickerid: Ответьте на стикер, чтобы получить ID его файла.

  × /zombies: Исключает удалённые аккаунты, известные боту (админ).

  × /github <user|user/repo>: Найти пользователя или репозиторий GitHub.

  × /wiki <search>: Поиск в английской Википедии.

  × /ud <term>: Поиск в Urban Dictionary.

  × /runs: Случайная шутка."
mutes_help_msg:
  "Иногда пользователи могут раздражать, и вы можете захотеть ограничить их
    от отправки сообщения в чат, этот модуль здесь, чтобы помочь, вы можете использовать этот модуль, чтобы заглушать участников в вашей группе.
  
  
    *Команды мута:* (только для администратора)
  
    × /mute <userhandle>: заглушает пользователя, (через ник или ответ)
  
    × /smute <userhandle>: заглушает пользователя без звука, не отправляет сообщение в группу,
    а также удаляет вашу команду. (через ник или ответ)
  
    × /dmute <userhandle>: заглушает пользователя и удаляет ответное сообщение. (через ник или ответ)
  
    × /tmute <userhandle> x(m/h/d): заглушает пользователя на `x` время. (через ник или ответ).
    m = минуты, h = часы, d = дни.
  
    × /unmute <userhandle>: снимает заглушку с пользователя. (через ник или ответ)"
notes_help_msg: 'Сохраняйте данные для будущих пользователей с помощью заметок!

  Заметки отлично подходят для сохранения случайных кусочков информации; номер телефона, приятный gif, забавная картинка — что угодно!

  *Пользовательские команды:*

  - /get <notename>: Получить заметку.

  - #notename: То же, что и /get.

  Команды администратора:

  - /save <notename> <note text>: Сохранить новую заметку с названием "word". Ответ на сообщение сохранит это сообщение. Работает даже с медиа!

  - /clear <notename>: Удалить связанную заметку.

  - /notes: Список всех заметок в текущем чате.

  - /saved: То же, что и /notes.

  - /clearall: Удалить ВСЕ заметки в чате. Это нельзя отменить.

  - /privatenotes: Отправлять ли заметки в ЛС. Будет отправлено сообщение с кнопкой, которую пользователи могут нажать, чтобы получить заметку в ЛС.'
pins_help_msg:
  "Все команды, связанные с закреплением, можно найти здесь; держите ваш чат в курсе
    последних новостей с помощью простого закреплённого сообщения!
  
  
    *Пользовательские команды:*
  
    × /pinned: Получить текущее закреплённое сообщение.
  
  
    *Команды администратора:*
  
    × /pin: Закрепить сообщение, на которое вы ответили. Добавьте 'loud' или 'notify', чтобы отправить уведомление участникам группы.
  
    × /pinned: Получает последнее закреплённое сообщение в текущем чате.
  
    × /permapin <text>: Закрепить пользовательское сообщение через бота. Это сообщение может содержать разметку, кнопки и все остальные крутые функции.
  
    × /unpin: Открепить текущее закреплённое сообщение. Если используется как ответ, открепляет сообщение, на которое ответили.
  
    × /unpinall: Открепляет все закреплённые сообщения.
  
    × /antichannelpin <yes/no/on/off>: Не позволять Telegram автоматически закреплять связанные каналы.
    Если аргументы не указаны, показывает текущую настройку.
  
    × /cleanlinked <yes/no/on/off>: Удалять сообщения, отправленные связанным каналом.
  
    Примечание: При использовании анти-канальных закреплений, убедитесь, что используете команду /unpin вместо ручного открепления. Иначе старое сообщение будет снова закреплено, когда канал отправит любые сообщения."
purges_help_msg: "*Только для администратора:*\n- /purge: удаляет все сообщения между этим и ответным сообщением.\n- /del: удаляет сообщение, на которое вы ответили.\n- /purgefrom: помечает сообщение, на которое вы ответили, как начало диапазона для удаления (затем используйте /purgeto).\n- /purgeto: удаляет все сообщения от метки /purgefrom до сообщения, на которое вы ответили.\n\n*Примеры*:\n- Удалить все сообщения с ответного сообщения до сих пор.\n-> `/purge`"
reports_help_msg:
  "Мы все занятые люди, у которых нет времени следить за нашими группами
    24/7. Но как вы реагируете, если кто-то в вашей группе спамит?
  
  
    × /report `<reason>`: ответить на сообщение, чтобы сообщить об этом администраторам.
  
    - @admin: то же, что и /report, но не команда.
  
  
    *Только для администраторов:*
  
    × /reports `<on/off/yes/no>`: изменить настройки отчётов или просмотреть текущий статус.
  
    - Если сделано в ЛС, переключает ваш статус.
  
    - Если в группе, переключает статус этой группы.
  
    × /reports `block` (только через ответ): Заблокировать пользователя от использования /report или @admin.
  
    × /reports `unblock` (только через ответ): Разблокировать пользователя от использования /report или @admin.
  
    × /reports `showblocklist`: Проверить всех заблокированных пользователей, которые не могут использовать /report или @admin.
  
  
    Чтобы сообщить о пользователе, просто ответьте на его сообщение с @admin или /report; Alita
    ответит сообщением, уведомляющим, что администраторы были уведомлены.
  
    Вы ДОЛЖНЫ ответить на сообщение, чтобы сообщить о пользователе; вы не можете просто использовать @admin, чтобы отмечать администраторов без причины!
  
  
    *ПРИМЕЧАНИЕ:* Ни одно из этих не будет активировано, если используется администраторами."
rules_help_msg:
  "Каждый чат работает с разными правилами; этот модуль поможет сделать
    эти правила понятнее!
  
    *Пользовательские команды*:
  
    × /rules: Проверить текущие правила чата.
  
    *Команды администратора*:
  
    × /setrules `<text>`: Установить правила для этого чата.
  
    × /privaterules `<yes/no/on/off>`: Включить/отключить отправку правил в приват.
  
    × /resetrules: Сбросить правила чата на стандартные
  
    × /rulesbtn `<custom text>`: Устанавливает текст кнопки правил.
  
    × /resetrulesbutton: Сбросить текст кнопки правил на стандартный.
  
    × /resetrulesbtn: То же, что и выше."
bot_updates_creators_plug: "\nПодписывайтесь на @DivideProjects для большего количества полезных ботов от моих создателей."
bot_updates_make_me_admin: "\n\nСделайте меня админом, чтобы пользоваться всеми моими возможностями!"
utils_string_handling_extract_time_invalid_time_amount: Указано неверное количество времени.
utils_string_handling_extract_time_invalid_time_type:
  "Указан неверный тип времени.
    Ожидалось m, h, или d, получено: %s"
warns_help_msg:
  "Держите ваших участников в порядке с помощью предупреждений; не давайте им выходить из под контроля!
  
    Если вы ищете автоматические предупреждения, прочитайте о модуле чёрного списка!
  
  
    *Команды администратора:*
  
    - /warn <reason>: Предупредить пользователя.
  
    - /dwarn <reason>: Предупредить пользователя через ответ и удалить его сообщение.
  
    - /swarn <reason>: Тихо предупредить пользователя и удалить ваше сообщение.
  
    - /warns: Посмотреть предупреждения пользователя.
  
    - /rmwarn: Удалить последнее предупреждение пользователя.
  
    - /resetwarn: Сбросить все предупреждения пользователя на 0.
  
    - /resetallwarns: Удалить все предупреждения в чате. Все пользователи возвращаются к 0 предупреждений.
  
    - /warnings: Получить настройки предупреждений чата.
  
    - /setwarnmode <ban/kick/mute/tban/tmute> [time]: Установить режим предупреждений чата.
  
    - /setwarntime <time/off>: Задать, сколько действует предупреждение, напр. 30d; off — бессрочно. Предупреждения, выданные до того, как бот начал записывать время, не истекают; их снимает /resetwarn.
  
    - /setwarnlimit <number>: Установить количество предупреждений до применения наказания.
  
  
    *Примеры*
  
    - Предупредить пользователя.
  
    -> `/warn @user За нарушение правил`"
users_help_msg:
  "Автоматический фоновый трекер пользователей и чатов. Этот модуль не имеет видимых
  пользователю команд — он молча записывает каждого отправителя сообщения и чат, в котором бот активен.

  *Что он отслеживает:*

  × ID пользователей, имена пользователей и отображаемые имена каждого отправителя.

  × ID чатов и названия каждой группы, в которой находится бот.

  × ID каналов, названия и имена пользователей связанных каналов.

  *Ограничение частоты:*

  × Обновления пользователей ограничены одним за UserUpdateInterval.

  × Обновления чатов ограничены одним за ChatUpdateInterval.

  Другие модули, такие как /info, зависят от данных, собранных этим модулем."

