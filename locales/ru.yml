captcha_help_msg:
  "Защитите свою группу от ботов и спамеров с помощью CAPTCHA-проверки!
  
  
    Заставьте новых участников доказать, что они люди, решив простую задачу, прежде чем они смогут отправлять сообщения.
  
  
    *Типы Captcha:*
  
    × Math: Решение простых математических задач
  
    × Text: Распознавание текста, показанного на изображении
  
  
    *Команды администратора:*
  
    × /captcha `<on/off>`: Включить или отключить проверку капчи
  
    × /captchamode `<math/text>`: Установить тип капчи (математические задачи или распознавание текста)
  
    × /captchatime `<1-10>`: Установить время ожидания в минутах (по умолчанию: 2)
  
    × /captchaaction `<kick/ban/mute>`: Установить действие при неудачной проверке (по умолчанию: kick)
  
    × /captchamaxattempts `<1-10>`: Установить максимальное количество попыток проверки (по умолчанию: 3)

  × /captchapending `<@user/user_id>`: Показать сохранённые сообщения ожидающего пользователя.

  × /captchaclear `<@user/user_id>`: Очистить сохранённые сообщения ожидающего пользователя.
  
  
    Когда включено, новые участники автоматически заглушаются до тех пор, пока не пройдут капчу.
  
    Если они не пройдут или истечёт время, будет применено настроенное действие."
