# Reactions module strings
# TODO: Translate
reactions_help_msg: |
  <b>🎭 Авто-реакции</b>

  Автоматически добавляйте реакции на сообщения с определёнными ключевыми словами!

  Настройте автоматические эмодзи-реакции, которые срабатывают, когда пользователи отправляют определённые слова.

  <b>Команды администратора:</b>
  • /addreaction <ключевое_слово> <эмодзи> - Добавить авто-реакцию
  • /removereaction <ключевое_слово> - Удалить реакцию
  • /reactions - Список настроенных реакций
  • /resetreactions - Очистить все реакции

  <b>Пример:</b>
  • /addreaction привет 👋 - Бот реагирует 👋, когда кто-то говорит "привет"

reactions_add_usage: "Использование: /addreaction &lt;ключевое_слово&gt; &lt;эмодзи&gt;"
reactions_invalid_emoji: "Пожалуйста, укажите корректный эмодзи."
reactions_add_error: "Не удалось сохранить реакцию. Пожалуйста, попробуйте снова."
reactions_add_success: "Реакция добавлена: <code>{keyword}</code> -> {emoji}"
reactions_remove_usage: "Использование: /removereaction &lt;ключевое_слово&gt;"
reactions_not_found: "Для этого чата не настроено ни одной реакции."
reactions_keyword_not_found: "Для ключевого слова не найдена реакция: <code>{keyword}</code>"
reactions_remove_error: "Не удалось удалить реакцию. Пожалуйста, попробуйте снова."
reactions_remove_success: "Реакция удалена для ключевого слова: <code>{keyword}</code>"
reactions_none: "В этом чате не настроено ни одной реакции."
reactions_list_header: "<b>Настроенные реакции:</b>\n{list}"
reactions_reset_success: "Все реакции для этого чата были сброшены."

# Backup/Restore module strings
backup_help_msg: |
  <b>📦 Резервное копирование и восстановление</b>

  Создавайте резервные копии и восстанавливайте настройки вашей группы с помощью этих команд:

  <b>Команды пользователя:</b>
  • /export - Экспортировать все настройки группы в JSON-файл
  • /export notes filters rules - Экспортировать только определённые модули

  <b>Команды создателя:</b>
  • /import - Ответьте на файл резервной копии, чтобы восстановить настройки
  • /import notes filters - Импортировать только определённые модули
  • /reset - Сбросить все настройки к значениям по умолчанию
  • /reset warns locks - Сбросить только определённые модули

  <b>Ограничения частоты:</b>
  • Экспорт: 1 раз в 5 минут
  • Импорт: 1 раз в 10 минут
  • Сброс: 1 раз в час

