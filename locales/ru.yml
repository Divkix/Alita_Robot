# AI spam filter module strings
aispam_help_msg: |
  <b>🤖 ИИ-фильтр спама</b>

  Необязательный фильтр, который оценивает каждое сообщение в этом чате с помощью ИИ-модели и удаляет те, которые она уверенно считает спамом.

  Больше ничего не происходит: ни предупреждения, ни мьюта, ни ответа, ни уведомления. Сообщение, в спаме которого модель уверена, удаляется беззвучно, и отправителю никогда не сообщают об этом.

  Сообщения на английском действуют с уверенности 80%, а сообщения на любом другом языке — с 90%, потому что модель оптимизирована под английский.


  <b>Команды администратора:</b>

  × /aispam: Показывает, включён ли фильтр, и что именно отправляется модели.

  × /aispam <code><on/off></code>: Включает или выключает фильтр в этом чате.


  Фильтр выключен во всех чатах, пока администратор его не включит, и требует, чтобы оператор бота настроил ключ API.
aispam_status_enabled: "ИИ-фильтр спама <b>включён</b> в этом чате."
aispam_status_disabled: "ИИ-фильтр спама <b>выключен</b> в этом чате. Включите его командой <code>/aispam on</code>."
aispam_status_key_missing: "⚠️ Недоступно: оператор бота не настроил ключ API, поэтому ни одно сообщение не проверяется."
aispam_status_globally_disabled: "⚠️ Недоступно: оператор бота выключил ИИ-фильтр спама глобально, поэтому ни одно сообщение не проверяется."
aispam_data_notice: |
  <b>Что отправляется по каждому проверяемому сообщению:</b>
  • Название, описание, правила и язык чата
  • Профиль отправителя: сколько дней назад бот впервые его увидел, сообщений за последний час, число предупреждений
  • Текст сообщения или подпись к медиа, домены ссылок и является ли оно пересланным или ответом
  • Несколько последних сообщений отправителя в этом чате


  Имена, имена пользователей, идентификаторы, номера телефонов и сообщения из других чатов не отправляются.
aispam_enabled_success: "✅ ИИ-фильтр спама теперь <b>включён</b>. Сообщения, в спаме которых модель уверена, будут удаляться."
aispam_disabled_success: "❌ ИИ-фильтр спама теперь <b>выключен</b>."
aispam_no_key: "❌ Я не могу включить ИИ-фильтр спама: оператор бота не настроил ключ API TypeSafe. Ничего не изменилось."
aispam_globally_disabled: "❌ Я не могу включить ИИ-фильтр спама: оператор бота выключил его глобально. Ничего не изменилось."
aispam_invalid_option: "Я понимаю только один из вариантов: <code>on</code>/<code>off</code>/<code>yes</code>/<code>no</code>/<code>true</code>/<code>false</code>/<code>enable</code>/<code>disable</code>"
aispam_breaker_notice: "⚠️ ИИ-проверки спама приостановлены в этом чате на несколько минут из-за повторяющихся сбоев поставщика ИИ. Они возобновятся сами, а фильтр останется включённым."

# Admin module extended documentation
admin_extended_docs: |
  <b>Поддержка анонимных администраторов</b>

  Команда <code>/anonadmin</code> позволяет владельцам групп переключать распознавание анонимных администраторов:
  <code>/anonadmin on</code> - Доверять анонимным администраторам без проверки
  <code>/anonadmin off</code> - Требовать подтверждение кнопкой (по умолчанию)

  Когда выключено (по умолчанию), бот запрашивает подтверждение кнопкой перед выполнением админских действий от анонимных аккаунтов.

  <b>Как работает проверка анонимного администратора:</b>
  1. Бот обнаруживает, что отправитель — GroupAnonymousBot
  2. Исходное сообщение кэшируется с TTL 20 секунд
  3. Кнопка "Нажмите, чтобы подтвердить администратора" отправляется в чат
  4. Пользователь, нажавший кнопку, проверяется как администратор, команда выполняется
  5. Кнопка истекает через 20 секунд, если не подтверждена

  <b>Поддерживаемые команды:</b>
  Admin: /promote, /demote, /title, /setgtitle, /setgpic, /setgdesc
  Bans: /ban, /dban, /sban, /tban, /unban, /kick, /dkick, /skick, /restrict, /unrestrict
  Mutes: /mute, /smute, /dmute, /tmute, /unmute
  Pins: /pin, /unpin, /permapin, /unpinall
  Purges: /purge, /del, /purgefrom, /purgeto
  Warns: /warn, /swarn, /dwarn

admin_notes_docs: |
  <b>Примечания по безопасности</b>
  • Весь пользовательский ввод экранируется HTML для предотвращения инъекционных атак
  • Изменения прав администратора выполняются с надлежащей обработкой ошибок и восстановлением после паники

# Antiflood extended docs
antiflood_notes_docs: |
  <b>Поведение по умолчанию</b>
  Антифлуд <b>отключён по умолчанию</b>. Вы должны явно включить его, используя <code>/setflood &lt;число&gt;</code>.

