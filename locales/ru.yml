disabling_help_msg:
  "Этот модуль позволяет вам отключить некоторые часто используемые команды,
    чтобы никто не мог их использовать. Это также позволит вам автоматически удалять их, не позволяя людям использовать синий текст.
  
  
    *Команды администратора*:
  
    × /disable `<commandname>`: Запретить пользователям использовать commandname в этой группе.
  
    × /enable `<item name>`: Разрешить пользователям использовать commandname в этой группе.
  
    × /disableable: Список всех отключаемых команд.
  
    × /disabledel `<yes/no/on/off>`: Удалять отключенные команды, когда используются не-администраторами.
  
    × /disabled: Список отключенных команд в этом чате.
  
  
    Примечание:
  
    При отключении команды, команда отключается только для не-администраторов. Все администраторы могут по-прежнему использовать эти команды.
  
    Отключенные команды всё ещё доступны через функцию /connect. Если вам интересно, чтобы это также было отключено, дайте мне знать в чате поддержки."
devs_help_msg:
  "Команды управления ботом и диагностики, доступные только владельцу бота и
  доверенным разработчикам. Эти команды не отображаются обычным пользователям.

  *Команды команды:*

  × /stats: Показать статистику бота и информацию о системе.

  × /teamusers: Список всех членов команды.

  *Команды владельца:*

  × /addsudo: Предоставить права sudo пользователю.

  × /adddev: Предоставить права разработчика пользователю.

  × /remsudo: Отозвать права sudo у пользователя.

  × /remdev: Отозвать права разработчика у пользователя.

  *Диагностические команды:*

  × /chatinfo: Показать подробную информацию о чате.

  × /chatlist: Создать и отправить список всех активных чатов.

  × /leavechat: Заставить бота покинуть указанный чат."
filters_help_msg:
  "Фильтры нечувствительны к регистру; каждый раз, когда кто-то говорит ваши триггерные слова, Alita будет отвечать чем-то другим! Это можно использовать для создания ваших команд, при желании.
  
  
    Команды:
  
    - /filter <trigger> <reply>: Каждый раз, когда кто-то говорит trigger, бот будет отвечать предложением. Для многословных фильтров заключите trigger в кавычки.
  
    - /filters: Список всех фильтров чата.
  
    - /stop <trigger>: Остановить бота от ответа на trigger.
  
    - /stopall: Остановить ВСЕ фильтры в текущем чате. Это действие не может быть отменено.
  
  
    Примеры:
  
    - Установить фильтр:
  
    -> /filter hello Hello there! How are you?
  
    - Установить многословный фильтр:
  
    -> /filter \"hello friend\" Hello back! Long time no see!
  
    - Установить фильтр, который могут использовать только администраторы:
  
    -> /filter example This filter won't  happen if a normal user says it {admin}
  
    - Чтобы сохранить файл, изображение, gif или любое другое вложение, просто ответьте на файл с:
  
    -> /filter trigger"
formatting_fillings: "<b>Заполнения</b>\n\nВы также можете настроить содержимое вашего сообщения с помощью контекстных данных. Например, вы могли бы упомянуть пользователя по имени в приветственном сообщении или упомянуть их в фильтре!\nВы можете использовать это, чтобы упоминать пользователя в заметках!\n\n<b>Поддерживаемые заполнения:</b>\n- <code>{first}</code>: Имя пользователя.\n- <code>{last}</code>: Фамилия пользователя.\n- <code>{fullname}</code>: Полное имя пользователя.\n- <code>{username}</code>: Имя пользователя. Если у них его нет, упоминает пользователя вместо этого.\n- <code>{mention}</code>: Упоминает пользователя с его именем.\n- <code>{id}</code>: ID пользователя.\n- <code>{chatname}</code>: Название чата.\n- <code>{rules}</code>: Добавляет кнопку Правила в сообщение.\n- <code>{protect}</code>: Защищает содержимое от пересылки.\n- <code>{preview}</code>: Включает превью в сообщениях.\n- <code>{nonotif}</code>: Отключает уведомление для этого сообщения."
formatting_help_msg: "Alita поддерживает большое количество опций форматирования, чтобы сделать ваши сообщения более выразительными. Посмотрите, нажав кнопки ниже!"
formatting_markdown: |
  <b>Форматирование Markdown</b>

  Вы можете форматировать ваше сообщение, используя <b>жирный</b>, <i>курсив</i>, <u>подчёркнутый</u>,
  и многое другое. Экспериментируйте!

  <b>Поддерживаемый markdown</b>:

  - <code>`code words`</code>: Обратные кавычки используются для моноширинных шрифтов. Показывается как: <code>code words</code>.

  - <code>_italic words_</code>: Подчёркивания используются для курсивных шрифтов. Показывается как: <i>italic words</i>.

  - <code>*bold words*</code>: Звёздочки используются для жирных шрифтов. Показывается как: <b>bold words</b>.

  - <code>~strikethrough~</code>: Тильды используются для зачёркивания. Показывается как: <strike>strikethrough</strike>.

  - <code>||spoiler||</code>: Двойные вертикальные черты используются для спойлеров. Показывается как: <tg-spoiler>Spoiler</tg-spoiler>.

  - <code>```pre```</code>: Чтобы форматер игнорировал другие символы форматирования внутри текста, отформатированного с помощью '```', будет: <code>**bold** | *bold*</code>.

  - <code>__underline__</code>: Двойные подчёркивания используются для подчёркивания. Показывается как: underline. ПРИМЕЧАНИЕ: Некоторые клиенты пытаются быть умными и интерпретируют это как курсив. В таком случае попробуйте использовать встроенное форматирование вашего приложения.

  - <code>[hyperlink](example.com)</code>: Это форматирование, используемое для гиперссылок. Показывается как: <a href='https://example.com/'>hyperlink</a>.

  - <code>[My Button](buttonurl://example.com)</code>: Это форматирование, используемое для создания кнопок. Этот пример создаст кнопку с названием "My button", которая открывает <code>example.com</code> при нажатии.

  Если вы хотите отправить кнопки в одном ряду, используйте форматирование <code>:same</code>.

  <b>Пример:</b>

  <code>[button 1](buttonurl:example.com)</code>

  <code>[button 2](buttonurl://example.com:same)</code>

  <code>[button 3](buttonurl://example.com)</code>

  Это покажет кнопки 1 и 2 в одной строке, а 3 под ними.
formatting_random: |
  <b>Случайное содержимое</b>

  Ещё одна вещь, которая может быть интересной, — это рандомизировать содержимое сообщения. Сделайте вещи немного более персональными, изменяя приветственные сообщения или заметки!

  Как использовать случайное содержимое:

  - %%%: Этот разделитель можно использовать для добавления случайных ответов бота.

  Например:

  <code>hello

  %%%

  how are you</code>

  Это случайно выберет между отправкой первого сообщения, "hello", или второго сообщения, "how are you".

  Используйте это, чтобы сделать Alita немного более индивидуальной! (работает только в фильтрах/заметках)

  Пример приветственного сообщения:

  - Каждый раз, когда новый пользователь присоединяется, ему будет показано одно из трёх сообщений,
  показанных здесь.

  -> /filter "hey"

  hello there <code>{first}</code>!

  %%%

  Ooooh, <code>{first}</code> how are you?

  %%%

  Sup? <code>{first}</code>
greetings_help_msg:
  "Приветствуйте новых участников ваших групп или прощайтесь с ними после их ухода!
  
  
    *Команды администратора:*
  
    × /setwelcome `<reply/text>`: Устанавливает приветственный текст для группы.
  
    × /welcome `<yes/no/on/off>`: Включает или отключает приветственные настройки для группы.
  
    × /resetwelcome: Сбрасывает приветственное сообщение на стандартное.
  
    × /setgoodbye `<reply/text>`: Устанавливает прощальное текст для группы.
  
    × /goodbye `<yes/no/on/off>`: Включает или отключает прощальные настройки для группы.
  
    × /resetgoodbye: Сбрасывает прощальное сообщение на стандартное.
  
    × /cleanservice `<yes/no/on/off>`: Удаляет все служебные сообщения, такие как уведомления 'x присоединился к группе'.
  
    × /cleanwelcome `<yes/no/on/off>`: Удаляет старое приветственное сообщение, всякий раз, когда новый участник присоединяется.
  
    × /autoapprove `<yes/no/on/off>`: Автоматически одобрять всех новых участников."
help_about: "@%s  — один из самых быстрых и функциональных менеджеров групп.\n\nAlita ✨ разработан и активно поддерживается @DivideProjects!\n\nAlita работает с 2020 года и обслуживала тысячи групп с сотнями тысяч пользователей!\n\n<b>Почему Alita:</b>\n- Простота: Лёгкое использование и совместимость с многими командами бота.\n- Функциональность: Множество функций, которых нет у других ботов управления группами.\n- Скорость: Угадайте? Это не сделано на Python, мы используем <a href='https://go.dev/'>Go</a> в качестве основного языка программирования.\n\n<b>Текущая версия:</b> %s"
help_configuration_step-1: "Добро пожаловать в конфигурацию Alita


  Первое, что нужно сделать, — добавить Alita ✨ в вашу группу! Для этого нажмите кнопку ниже и выберите вашу группу, затем нажмите Готово для продолжения обучения."
help_configuration_step-2: "Хорошо, молодец!


  Теперь, чтобы я работал правильно, вам нужно сделать меня администратором вашей группы!

  Для этого выполните следующие простые шаги:

  ▫️ Перейдите в вашу группу

  ▫️ Нажмите на название группы

  ▫️ Нажмите Изменить

  ▫️ Нажмите на Администраторы

  ▫️ Нажмите Добавить администратора

  ▫️ Нажмите на Лупу

  ▫️ Найдите @%s

  ▫️ Подтвердите"
help_configuration_step-3: "Отлично!


  Теперь бот готов к использованию!

  Все команды можно использовать с / или !


  Если у вас возникают трудности с настройкой меня в вашей группе, не стесняйтесь зайти в @DivideSupport.

  Мы будем рады помочь вам."
help_donatetext:
  "Так вы хотите сделать пожертвование? Потрясающе!
  
    Когда вы жертвуете, все средства идут на мою разработку, что делает меня быстрым и отзывчивым.
  
    Ваше пожертвование также может помочь мне получить одну или две новые функции, которых я не смог получить из-за ограничений сервера.
  
    Все средства будут направлены на мои сервисы, такие как база данных, хранилище и хостинг!
  
    Вы можете пожертвовать, связавшись с моим владельцем здесь: @DivideProjectsBot"
