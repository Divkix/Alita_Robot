connections_help_msg:
  "Этот модуль позволяет вам подключиться к базе данных чата и
    добавлять вещи в неё, не сообщая чату об этом! По понятным причинам, вы должны быть администратором, чтобы добавлять вещи; но любой участник может просматривать ваши данные. (забаненные/выгнанные пользователи не могут!)
  
  
    *Команды*:
  
    × /connect `<chatid>`: Подключиться к указанному чату, позволяя просматривать/редактировать содержимое.
  
    × /disconnect: Отключиться от текущего чата.
  
    × /reconnect: Подключиться снова к ранее подключенному чату
  
    × /connection: Посмотреть информацию о текущем подключенном чате.
  
    × /settings: Выберите группу, где вы админ, и посмотрите все её настройки; значения, отличные от стандартных, помечены •. В списке только группы, где вы писали после моего добавления; для остальных используйте /connect `<chatid>` или отправьте /settings в самой группе.
  
  
    *Команды администратора:*
  
    × /allowconnect <yes/no>: Разрешить или запретить пользователям подключаться к чатам.
  
    При подключении админы могут также выполнять из лички /captcha, /antiraid, /aispam, /anonadmin, /addreaction, /allowconnect и /lang group.
  
  
    Вы можете получить ID чата, используя команду /id в вашем чате. Не удивляйтесь, если ID отрицательный; все супергруппы имеют отрицательные ID."
