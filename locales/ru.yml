admin_help_msg: "Облегчите продвижение и понижение пользователей с помощью модуля администратора!\n\n*Пользовательские команды:*\n× /adminlist: Список администраторов в текущем чате.\n\n*Команды администратора:*\n× /promote `<reply/username/mention/userid>` `[title]`: Повысить пользователя, при желании с собственным заголовком администратора (не более 16 символов).\n× /demote `<reply/username/mention/userid>`: Понизить пользователя.\n× /title `<reply/username/mention/userid>` `<custom title>`: Установить заголовок администратора для пользователя\n× /setgtitle <title>: Изменить название группы.\n× /setgpic: Ответьте на фото, чтобы установить его как изображение группы.\n× /setgdesc [text]: Изменить описание группы.\n× /invitelink: Получить ссылку-приглашение в чат.\n× /anonadmin `<on/off>`: on позволяет анонимным администраторам действовать без подтверждения; off (по умолчанию) требует подтверждения кнопкой (только владелец группы).\n× /admincache: Перезагрузить список администраторов.\n× /clearadmincache: Очистить кэшированный список администраторов."
