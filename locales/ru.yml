# Rose feature-parity keys (federations, log channels, extras)
federations_help_msg: |
  Федерации используют общий список банов для всех ваших групп.

  *Владелец (в личке):*
  × /newfed <name>: Создать федерацию (одну на пользователя).
  × /renamefed <name>: Переименовать федерацию.
  × /delfed: Удалить федерацию (с подтверждением).
  × /fedpromote /feddemote: Управлять админами федерации.
  × /fedreason on/off: Требовать причину для fban.
  × /fednotif on/off: Сообщать владельцу о fban в личку.
  × /subfed /unsubfed /fedsubs: Подписаться на другую федерацию (не больше 5).
  × /fbanlist [csv|json|minicsv]: Выгрузить fban.
  × /importfbans: Загрузить из файла CSV/JSON в ответе.
  × /setfedlog /unsetfedlog: Чат для логов федерации.

  *Владелец группы:*
  × /joinfed <fed_id>: Подключить этот чат к федерации.
  × /leavefed: Выйти из федерации.
  × /quietfed on/off: Скрыть фоновые уведомления о fban.

  *Админы федерации:*
  × /fban /unfban /funban: Бан/разбан в федерации.
  × /fedstat /fbanstat: Проверить fban пользователя.
  × /feddemoteme <fed_id>: Сложить с себя права админа федерации.

  *Все:*
  × /fedinfo /fedadmins /chatfed /myfeds
logchannels_help_msg: |
  Отправляйте действия админов в отдельный канал логов.

  1. Добавьте бота в канал как администратора.
  2. В этом канале отправьте /setlog.
  3. Перешлите это сообщение в группу.

  *Команды администратора:*
  × /setlog: Назначить канал логов (отправьте в канале, затем перешлите сообщение в группу).
  × /unsetlog: Убрать канал логов.
  × /logchannel: Показать текущий канал логов.
  × /logcategories: Список категорий.
  × /log <category>: Включить категорию.
  × /nolog <category>: Выключить категорию.

  Категории: settings, admin, user, automated, reports, other.
