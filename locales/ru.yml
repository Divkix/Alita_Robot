blacklists_help_msg: "*Пользовательские команды:*\n× /blacklists: Проверить все чёрные списки в чате.\n\n*Команды администратора:*\n× /addblacklist `<trigger>`: Добавляет слово в чёрный список в текущем чате.\n× /rmblacklist `<trigger>`: Удаляет слово из чёрного списка в текущем чате.\n× /blaction `<mute/kick/ban/warn/none>`: Устанавливает действие, выполняемое ботом при обнаружении слова из чёрного списка.\n× /blacklistaction: То же, что и выше\n\n*Только для владельца:*\n× /remallbl: Удаляет все слова из чёрного списка чата\n\n*Примечание:*\nРежим по умолчанию для Чёрного списка *warn*, который удаляет сообщение и выдаёт предупреждение пользователю."
