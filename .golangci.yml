# golangci-lint configuration for Alita Robot
version: "2"

run:
  timeout: 5m
  build-tags: ["testtools"]

# Linters to enable
linters:
  enable:
    - godox      # Detects TODO, FIXME, and other keywords
    - dupl       # Detects duplicate code fragments
    - gocyclo    # Cyclomatic complexity analysis
    - forbidigo  # Calls AGENTS.md forbids in production code or the panel
    - depguard   # Imports AGENTS.md forbids
  settings:
    depguard:
      rules:
        no-mocks:
          list-mode: lax
          deny:
            - pkg: github.com/stretchr/testify/mock
              desc: &no-mocks "use real fixtures (internal/testdb, miniredis, hand-written fakes), not mock libraries"
            - pkg: github.com/golang/mock
              desc: *no-mocks
            - pkg: go.uber.org/mock
              desc: *no-mocks
    forbidigo:
      # Match by real package name, so an aliased import is still caught.
      analyze-types: true
      # Each msg prefix ("automigrate:", "panel-chat-status:") is matched by
      # an exclusions rule below; rename both together.
      forbid:
        - pattern: '^gorm\.(DB|Migrator)\.AutoMigrate$'
          msg: "automigrate: migrations/*.sql is the schema; AutoMigrate belongs in tests only"
        - pattern: '^chat_status\.(Can\w+|IsUserConnected|UserHasPermissionForUpdate)$'
          msg: "panel-chat-status: never call chat_status Can* or reply-sending helpers from the panel"
    dupl:
      threshold: 100
    gocyclo:
      # Minimal complexity to report.
      # Threshold of 20 catches problematic functions while allowing reasonable complexity.
      # CI reports all functions > 15 for visibility and gradual improvement.
      min-complexity: 20
  # Exclusions for complexity checks
  exclusions:
    rules:
      # Exclude gocyclo and dupl for test files (table-driven tests often have high complexity/similar patterns)
      - path: _test\.go
        linters:
          - gocyclo
          - dupl
      # AutoMigrate is how test fixtures build their schema
      - path: (_test\.go$|^internal/testdb/)
        linters:
          - forbidigo
        text: "automigrate:"
      # The chat_status reply ban applies to the admin panel only
      - path-except: ^alita/panel/
        linters:
          - forbidigo
        text: "panel-chat-status:"
      # Exclude generated files
      - path: scripts/generate_docs/
        linters:
          - gocyclo
      # Exclude pre-existing complex migration logic (moved from alita/db/migrations.go)
      - path: alita/db/migrations/
        linters:
          - gocyclo

# Output settings
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Only fail on new issues - allows gradual improvement of existing codebase
  # Remove this once existing complexity issues are addressed
  new: true

# Imports: stdlib, third-party, internal, separated by blank lines (AGENTS.md)
formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/divkix/Alita_Robot)
